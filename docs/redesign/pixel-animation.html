<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Animation</title>
<style>
  :root { --bg: #0e0a1f; --fg: #f4e9c8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
         font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block;
           box-shadow: 0 0 0 4px #2a1f4d, 0 0 0 8px #0e0a1f, 0 0 0 10px #4b3a85; }
  p { margin: 8px 16px 0; opacity: .7; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="160" height="90" aria-label="Pixel-kunst animation: en helt løber og samler mønter"></canvas>
<p>Klik / mellemrum = hop</p>

<script>
(() => {
  'use strict';
  const W = 160, H = 90, GROUND = 72;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // ---------- palette (limited, 8-bit feel) ----------
  const P = {
    sky: ['#1b1042', '#2d1b69', '#4a2a8c', '#7a3a9a', '#b04a8f', '#e0627a', '#f79a6b'],
    star: '#fff6d6', moon: '#f4e9c8', moonShade: '#cdbf9a',
    cloud: '#6d4b9e', cloudHi: '#8f6bc2',
    farHill: '#3a2a73', nearHill: '#2b3f6e', nearHi: '#35508a',
    grass: '#5fcf5a', grassDk: '#3a9b4a', dirt: '#8a5a3a', dirtDk: '#6a4026',
    coin: '#ffd84a', coinDk: '#d98f1e', coinHi: '#fff3a8',
    k: '#14101f', s: '#f2b98c', w: '#ffffff', r: '#e23d4b', b: '#3f7ad9', n: '#2a3a8c',
  };

  // ---------- helpers ----------
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); };
  const rnd = (a, b) => a + Math.random() * (b - a);

  function sprite(rows, x, y, flip) {
    for (let j = 0; j < rows.length; j++) {
      const row = rows[j];
      for (let i = 0; i < row.length; i++) {
        const ch = row[flip ? row.length - 1 - i : i];
        if (ch !== '.') rect(x + i, y + j, 1, 1, P[ch]);
      }
    }
  }

  // 3x5 pixel font
  const GLYPH = {
    0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111',
    4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001001001001',
    8: '111101111101111', 9: '111101111001111', '+': '000010111010000',
  };
  function text(str, x, y, c) {
    for (const ch of String(str)) {
      const g = GLYPH[ch];
      if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') rect(x + (i % 3), y + ((i / 3) | 0), 1, 1, c);
      x += 4;
    }
  }

  // ---------- hero sprite: 8x10, 4-frame walk cycle ----------
  const TOP = [
    '..rrrr..',
    '.rrrrrr.',
    '.ssssss.',
    '.sksssk.',
    '.ssssss.',
    '..bbbb..',
    '.sbbbbs.',
    '..bbbb..',
  ];
  const LEGS = [
    ['.nn..nn.', 'kk....kk'], // stride A
    ['..nnnn..', '..kkkk..'], // passing
    ['.nn..nn.', 'kk....kk'], // stride B (mirrored by flip-less symmetry)
    ['..nnnn..', '..kkkk..'],
  ];
  const JUMP_LEGS = ['nn....nn', 'kk....kk'];
  const heroFrame = (f, jumping) => TOP.concat(jumping ? JUMP_LEGS : LEGS[f]);

  // ---------- world state ----------
  const stars = Array.from({ length: 36 }, () => ({
    x: (Math.random() * W) | 0, y: (Math.random() * 40) | 0, ph: Math.random() * 6, big: Math.random() < .2,
  }));
  const clouds = Array.from({ length: 4 }, (_, i) => ({ x: i * 48 + rnd(0, 20), y: 10 + ((Math.random() * 22) | 0), s: 1 + (i % 2) }));
  const coins = [];
  const sparks = [];
  const pops = [];
  let scroll = 0, t = 0, score = 0;
  const hero = { x: 34, y: 0, vy: 0, air: false, frame: 0, ft: 0 };
  const SPEED = 48, JUMP_V = 118, GRAV = 360;

  function spawnCoin(x) {
    coins.push({ x, y: GROUND - 20 - ((Math.random() * 6) | 0), spin: Math.random() * 4, got: false });
  }
  for (let i = 0; i < 4; i++) spawnCoin(90 + i * 70);

  // ---------- drawing ----------
  function drawSky() {
    const bandH = 12;
    for (let i = 0; i < P.sky.length; i++) {
      rect(0, i * bandH, W, bandH + 1, P.sky[i]);
      // dithered seam between bands (classic 8-bit gradient trick)
      if (i > 0) for (let x = 0; x < W; x += 2) rect(x + (i & 1), i * bandH - 1, 1, 1, P.sky[i]);
    }
    for (const s of stars) {
      const on = ((t * 2 + s.ph) % 3) < 2.2;
      if (!on) continue;
      rect(s.x, s.y, 1, 1, P.star);
      if (s.big) { rect(s.x - 1, s.y, 3, 1, P.star); rect(s.x, s.y - 1, 1, 3, P.star); }
    }
    // moon with craters
    const mx = 124, my = 16;
    for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++)
      if (x * x + y * y <= 30) rect(mx + x, my + y, 1, 1, P.moon);
    rect(mx - 3, my - 2, 2, 2, P.moonShade); rect(mx + 2, my + 1, 2, 2, P.moonShade); rect(mx - 1, my + 3, 1, 1, P.moonShade);
  }

  function drawClouds(dt) {
    for (const c of clouds) {
      c.x -= (5 + c.s * 3) * dt;
      if (c.x < -30) { c.x = W + rnd(0, 30); c.y = 8 + ((Math.random() * 24) | 0); }
      const x = c.x | 0, y = c.y, u = c.s;
      rect(x + 4 * u, y, 10 * u, 2 * u, P.cloud);
      rect(x, y + 2 * u, 18 * u, 3 * u, P.cloud);
      rect(x + 4 * u, y, 6 * u, 1, P.cloudHi);
    }
  }

  function hills(offset, base, amp, color, hi) {
    for (let x = 0; x < W; x++) {
      const wx = x + offset;
      const h = Math.round(amp * (Math.sin(wx * 0.045) * 0.6 + Math.sin(wx * 0.11 + 1.3) * 0.4));
      const top = base - h;
      rect(x, top, 1, GROUND - top + 1, color);
      if (hi) rect(x, top, 1, 1, hi);
    }
  }

  function drawGround() {
    rect(0, GROUND, W, 3, P.grass);
    rect(0, GROUND + 3, W, H - GROUND - 3, P.dirt);
    const off = scroll | 0;
    for (let x = 0; x < W + 8; x += 8) {
      const gx = x - (off % 8);
      rect(gx + 2, GROUND - 1, 1, 1, P.grass);       // grass tufts
      rect(gx + 5, GROUND - 1, 1, 1, P.grass);
      rect(gx, GROUND + 2, 8, 1, P.grassDk);         // shadow edge
      rect(gx + 1, GROUND + 7, 2, 2, P.dirtDk);      // pebbles
      rect(gx + 5, GROUND + 11, 2, 1, P.dirtDk);
    }
  }

  function drawCoin(c) {
    const f = (c.spin | 0) % 4;
    const w = [5, 3, 1, 3][f];
    const bob = Math.round(Math.sin(t * 4 + c.x * 0.1));
    const x = (c.x | 0) - ((w / 2) | 0), y = c.y + bob;
    rect(x, y + 1, w, 5, P.coinDk);
    rect(x + (w > 1 ? 1 : 0), y, Math.max(1, w - 2), 7, P.coin);
    if (w >= 3) rect(x + 1, y + 1, 1, 2, P.coinHi);
  }

  function drawHero() {
    const jumping = hero.air;
    const bob = !jumping && (hero.frame % 2 === 1) ? -1 : 0;
    const y = Math.round(GROUND - 10 - hero.y) + bob;
    // blob shadow shrinks with height
    const sw = Math.max(2, 8 - ((hero.y / 5) | 0));
    rect(hero.x + 4 - (sw >> 1), GROUND, sw, 1, P.grassDk);
    sprite(heroFrame(hero.frame, jumping), hero.x, y);
  }

  // ---------- particles ----------
  function burst(x, y) {
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      sparks.push({ x, y, vx: Math.cos(a) * rnd(20, 40), vy: Math.sin(a) * rnd(20, 40) - 10, life: rnd(.35, .6),
                    c: [P.coin, P.coinHi, P.w][i % 3] });
    }
    pops.push({ x: x - 4, y: y - 6, life: .8 });
  }

  function updateFx(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life -= dt; p.vy += 120 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) sparks.splice(i, 1); else rect(p.x, p.y, 1, 1, p.c);
    }
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i];
      p.life -= dt; p.y -= 14 * dt;
      if (p.life <= 0) pops.splice(i, 1); else text('+1', p.x | 0, p.y | 0, P.coinHi);
    }
  }

  // ---------- simulation ----------
  function jump() { if (!hero.air) { hero.air = true; hero.vy = JUMP_V; } }

  function step(dt) {
    t += dt;
    scroll += SPEED * dt;

    // walk cycle at a deliberate 8 fps (steppy animation = 8-bit feel)
    hero.ft += dt;
    if (hero.ft > 1 / 8) { hero.ft = 0; hero.frame = (hero.frame + 1) % 4; }

    if (hero.air) {
      hero.vy -= GRAV * dt; hero.y += hero.vy * dt;
      if (hero.y <= 0) { hero.y = 0; hero.vy = 0; hero.air = false; }
    }

    for (const c of coins) {
      c.x -= SPEED * dt; c.spin += dt * 8;
      const dx = c.x - (hero.x + 4);
      if (!c.got && dx < 17 && dx > 0) jump(); // auto-hop toward the next coin
      if (!c.got && Math.abs(dx) < 5 && Math.abs((GROUND - 10 - hero.y + 5) - (c.y + 3)) < 9) {
        c.got = true; score = (score + 1) % 1000; burst(c.x, c.y + 3);
      }
      if (c.x < -10) { c.x = W + rnd(10, 60); c.y = GROUND - 20 - ((Math.random() * 6) | 0); c.got = false; }
    }
  }

  function render(dt) {
    drawSky();
    drawClouds(dt);
    hills(scroll * 0.25, 60, 12, P.farHill);
    hills(scroll * 0.5 + 40, 68, 8, P.nearHill, P.nearHi);
    drawGround();
    for (const c of coins) if (!c.got) drawCoin(c);
    drawHero();
    updateFx(dt);
    // HUD
    rect(4, 4, 5, 5, P.coinDk); rect(5, 5, 3, 3, P.coin);
    text(String(score).padStart(3, '0'), 12, 4, P.w);
  }

  // ---------- fit canvas to screen at integer scale ----------
  function fit() {
    const s = Math.max(1, Math.floor(Math.min((innerWidth - 40) / W, (innerHeight - 90) / H)));
    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  }
  addEventListener('resize', fit); fit();

  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
  cv.addEventListener('pointerdown', jump);

  // ---------- loop ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { step(0.5); render(0); return; } // single still frame

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt); render(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
