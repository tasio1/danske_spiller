name: Claude fix
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  fix:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowed-tools "Edit,Read,Write,Bash(git *),Bash(npm *),Bash(curl *)"
