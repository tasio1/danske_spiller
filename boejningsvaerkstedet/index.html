<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bøjningsværkstedet 🛠️</title>
<style>
  /* ---- Bøjningsværkstedet — parchment/brass bookbinding workshop ----
     Palette (prd.md § 2.2): Parchment #E8DDC4, Dark parchment #2B2925,
     Wood #7A5134, Brass #B88A44, Ink #282622, Correct #50744B,
     Wrong #8C413A, Adjektiv amber #C58A37, Navneord blue #49758A,
     Artikel violet #735C83. */
  :root{
    --parchment:#E8DDC4;
    --wood:#7A5134;
    --brass:#B88A44;
    --ink:#282622;
    --correct:#50744B;
    --wrong:#8C413A;
    --adj:#C58A37;
    --noun:#49758A;
    --article:#735C83;

    --bg:#E8DDC4;
    --panel:#F1E9D6;
    --panel-2:#e2d6ba;
    --text:#282622;
    --muted:#6b5f4c;
    --line:rgba(122,81,52,.35);
    --shadow:0 14px 40px rgba(40,30,20,.22);

    /* DanskCore quiz renderer theming hooks (used by future modes) */
    --dc-fg:var(--text);
    --dc-btn-bg:var(--panel);
    --dc-border:var(--line);
    --dc-accent:var(--brass);
    --dc-accent-fg:#2b2118;
    --dc-input-bg:#fbf6ea;
    --dc-correct:var(--correct);
    --dc-correct-bg:rgba(80,116,75,.16);
    --dc-wrong:var(--wrong);
    --dc-wrong-bg:rgba(140,65,58,.16);
  }
  html[data-theme="dark"]{
    --bg:#2B2925;
    --panel:#35322c;
    --panel-2:#3f3b33;
    --text:#E8DDC4;
    --muted:#b8ac93;
    --line:rgba(184,138,68,.35);
    --shadow:0 14px 40px rgba(0,0,0,.5);
    --dc-input-bg:#2f2c26;
    --dc-accent-fg:#221a10;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 8%, rgba(184,138,68,.16), transparent 42%),
      radial-gradient(circle at 85% 90%, rgba(122,81,52,.18), transparent 46%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh;
    padding:18px 12px 48px;
    display:flex;justify-content:center;align-items:flex-start;
    line-height:1.45;
  }

  .shell{width:100%;max-width:640px}

  header.topbar{
    display:flex;align-items:center;gap:.6em;margin-bottom:16px;
  }
  .brand{
    font-weight:700;font-size:1.35rem;letter-spacing:.01em;
    color:var(--wood);flex:1 1 auto;display:flex;align-items:center;gap:.4em;
  }
  html[data-theme="dark"] .brand{color:var(--brass)}
  .icon-btn{
    min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    font-size:1.15rem;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:10px;cursor:pointer;
  }
  .icon-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .card{
    background:
      linear-gradient(180deg, rgba(255,255,255,.28), transparent 26%),
      repeating-linear-gradient(0deg, rgba(122,81,52,.05) 0 1px, transparent 1px 24px),
      var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:20px 18px;
  }

  h1.title{
    margin:.1em 0 .1em;font-size:1.9rem;color:var(--wood);
  }
  html[data-theme="dark"] h1.title{color:var(--brass)}
  .lede{margin:.2em 0 1.2em;color:var(--muted)}

  .group-label{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1em 0 .5em}

  .chips{display:flex;flex-wrap:wrap;gap:.5em}
  .chip{
    min-height:44px;padding:.5em .95em;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    cursor:pointer;font:inherit;font-size:.95rem;
  }
  .chip[aria-pressed="true"]{
    background:var(--brass);color:#2b2118;border-color:var(--brass);font-weight:600;
  }
  .chip:focus-visible{outline:2px solid var(--wood);outline-offset:2px}

  .modes{display:flex;flex-direction:column;gap:.5em}
  .mode-btn{
    display:flex;align-items:center;gap:.7em;text-align:left;
    min-height:52px;padding:.6em .9em;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    cursor:pointer;font:inherit;
  }
  .mode-btn .num{
    width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:var(--wood);color:#f3e8d2;
    display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;
  }
  .mode-btn .mtxt{flex:1 1 auto}
  .mode-btn .mname{font-weight:600}
  .mode-btn .mmeta{font-size:.82rem;color:var(--muted)}
  .mode-btn[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 2px rgba(184,138,68,.35) inset}
  .mode-btn[disabled]{opacity:.5;cursor:not-allowed}
  .mode-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .primary{
    margin-top:1.3em;width:100%;min-height:54px;font-size:1.15rem;font-weight:700;
    border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,var(--brass),#a2792f);color:#2b2118;
    box-shadow:0 6px 0 rgba(122,81,52,.5),var(--shadow);
  }
  .primary:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(122,81,52,.5)}
  .primary:focus-visible{outline:2px solid var(--wood);outline-offset:3px}

  .btn{
    min-height:44px;padding:.55em 1.1em;border-radius:10px;cursor:pointer;font:inherit;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
  }
  .btn.accent{background:var(--brass);color:#2b2118;border-color:var(--brass);font-weight:600}
  .btn:focus-visible{outline:2px solid var(--wood);outline-offset:2px}

  /* ---- play screen ---- */
  .playbar{display:flex;align-items:center;gap:.6em;margin-bottom:12px}
  .playbar .back{min-width:44px}
  .progress{flex:1 1 auto;height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
  .progress > i{display:block;height:100%;background:var(--wood);width:0;transition:width .3s ease}
  html[data-theme="dark"] .progress > i{background:var(--brass)}
  .count{font-size:.85rem;color:var(--muted);min-width:3.2em;text-align:right}

  .material{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;margin-bottom:.4em}
  .lemma{font-size:1.7rem;font-weight:700;color:var(--noun)}
  html[data-theme="dark"] .lemma{color:#8fbdd2}
  .gender-tag{
    font-size:.8rem;padding:.25em .7em;border-radius:999px;font-weight:600;
    background:rgba(115,92,131,.16);color:var(--article);border:1px solid rgba(115,92,131,.4);
  }
  html[data-theme="dark"] .gender-tag{color:#c4a9d6}
  .ask{color:var(--muted);margin:.1em 0 1em}

  table.grid{width:100%;border-collapse:separate;border-spacing:8px;margin:0 0 1em}
  table.grid th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center;padding:.2em}
  table.grid th.rowh{text-align:right;white-space:nowrap}
  table.grid td{
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:.7em .5em;text-align:center;min-height:44px;font-size:1.05rem;
  }
  table.grid td.filled{color:var(--muted);font-style:italic}
  table.grid td.target{
    background:#fbf6ea;border:2px dashed var(--brass);padding:.3em;
  }
  html[data-theme="dark"] table.grid td.target{background:#2f2c26}
  table.grid td.target.done-correct{border-style:solid;border-color:var(--correct);background:var(--dc-correct-bg)}
  table.grid td.target.done-wrong{border-style:solid;border-color:var(--wrong);background:var(--dc-wrong-bg)}

  .answer-row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
  input.answer{
    flex:1 1 9em;min-height:48px;padding:.5em .8em;font:inherit;font-size:1.15rem;
    border:1px solid var(--line);border-radius:10px;background:var(--dc-input-bg);color:var(--text);
    text-align:center;
  }
  input.answer:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

  /* ---- Mode 3 (Adjektivværkstedet) frame ---- */
  .adj-lemma{font-size:1.7rem;font-weight:700;color:var(--adj)}
  html[data-theme="dark"] .adj-lemma{color:#e0b26a}
  .feat-tags{display:flex;flex-wrap:wrap;gap:.4em;margin:.2em 0 .8em}
  .feat-tag{font-size:.8rem;padding:.25em .7em;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
  .frame{font-size:1.15rem;color:var(--text);margin:.2em 0 1em}
  .frame .blank{display:inline-block;min-width:3.4em;border-bottom:2px dashed var(--brass);text-align:center}

  /* ---- Mode 2 (Byg navneordet) workbench ---- */
  .workbench{display:flex;gap:.55em;justify-content:center;flex-wrap:wrap;margin:.5em 0 1em}
  .slot-col{display:flex;flex-direction:column;align-items:center;gap:.3em}
  .slot-cap{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .slot{
    min-width:5em;min-height:52px;padding:.4em .6em;border-radius:10px;
    border:2px dashed var(--brass);background:#fbf6ea;color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:default;
  }
  html[data-theme="dark"] .slot{background:#2f2c26}
  .slot.filled{border-style:solid;cursor:pointer}
  .slot.done-correct{border-color:var(--correct);background:var(--dc-correct-bg)}
  .slot.done-wrong{border-color:var(--wrong);background:var(--dc-wrong-bg)}
  .slot:focus-visible{outline:2px solid var(--wood);outline-offset:2px}
  .tray{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;margin-bottom:.4em}
  .tile{
    min-height:44px;min-width:44px;padding:.5em .95em;border-radius:10px;font:inherit;font-size:1.05rem;
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;
  }
  .tile:disabled{opacity:.32;cursor:default}
  .tile:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .label-print{text-align:center;font-size:1.35rem;font-weight:700;color:var(--noun);margin:.3em 0}
  html[data-theme="dark"] .label-print{color:#8fbdd2}

  /* ---- Mode 4 (Sammenligningspressen) three-slot press ---- */
  .press-row{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin:.4em 0 1em}
  .press-col{display:flex;flex-direction:column;align-items:center;gap:.3em;flex:1 1 6.5em;min-width:6.5em}
  .press-col .slot-cap{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .press-col .arrow{color:var(--brass);font-size:1.2rem;align-self:center;padding-top:1.1em}
  input.slot-input{
    width:100%;min-height:48px;padding:.5em .5em;font:inherit;font-size:1.1rem;
    border:1px solid var(--line);border-radius:10px;background:var(--dc-input-bg);color:var(--text);text-align:center;
  }
  input.slot-input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
  input.slot-input.done-correct{border:2px solid var(--correct);background:var(--dc-correct-bg)}
  input.slot-input.done-wrong{border:2px solid var(--wrong);background:var(--dc-wrong-bg)}

  /* ---- Modes 5 & 6 (multiple choice in context) ---- */
  .context{
    font-size:1.2rem;line-height:1.6;color:var(--text);margin:.3em 0 1em;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:.8em .9em;
  }
  .context .blank{
    display:inline-block;min-width:3.2em;border-bottom:2px dashed var(--brass);
    text-align:center;font-weight:600;
  }
  .context .blank.done-correct{border-bottom-color:var(--correct);color:var(--correct)}
  .context .blank.done-wrong{border-bottom-color:var(--wrong);color:var(--wrong)}
  html[data-theme="dark"] .context .blank.done-correct{color:#8fc088}
  html[data-theme="dark"] .context .blank.done-wrong{color:#d98f88}
  .options{display:flex;flex-direction:column;gap:.5em}
  .opt{
    display:flex;align-items:center;gap:.7em;text-align:left;
    min-height:48px;padding:.55em .9em;border-radius:11px;font:inherit;font-size:1.05rem;
    border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;
  }
  .opt .onum{
    width:26px;height:26px;flex:0 0 auto;border-radius:7px;background:var(--wood);color:#f3e8d2;
    display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;
  }
  .opt:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .opt:disabled{cursor:default}
  .opt.chosen-correct{border-color:var(--correct);background:var(--dc-correct-bg)}
  .opt.chosen-wrong{border-color:var(--wrong);background:var(--dc-wrong-bg)}
  .opt.reveal-correct{border-color:var(--correct);box-shadow:0 0 0 2px rgba(80,116,75,.35) inset}

  .slip{
    margin-top:1em;border-left:4px solid var(--brass);background:var(--panel-2);
    border-radius:0 8px 8px 0;padding:.7em .9em;font-size:.98rem;
  }
  .slip.correct{border-left-color:var(--correct)}
  .slip.wrong{border-left-color:var(--wrong)}
  .slip .sol{font-weight:700}
  .slip .sol.ok{color:var(--correct)}
  .slip .sol.bad{color:var(--wrong)}
  html[data-theme="dark"] .slip .sol.ok{color:#8fc088}
  html[data-theme="dark"] .slip .sol.bad{color:#d98f88}
  .slip .note{margin-top:.35em;color:var(--text)}
  .slip .actions{margin-top:.7em;display:flex;gap:.5em;flex-wrap:wrap;align-items:center}

  .empty-state{text-align:center;color:var(--muted);padding:1.5em .5em}
  .empty-state .big{font-size:2.2rem;display:block;margin-bottom:.3em}

  /* round summary */
  .sum-head{font-size:1.4rem;color:var(--wood);margin:.1em 0 .6em}
  html[data-theme="dark"] .sum-head{color:var(--brass)}
  .sum-stats{display:flex;gap:1.4em;flex-wrap:wrap;margin-bottom:1em}
  .sum-stats .stat b{display:block;font-size:1.8rem;color:var(--text)}
  .sum-stats .stat span{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .weak-list{list-style:none;padding:0;margin:.2em 0 1em;display:flex;flex-direction:column;gap:.4em}
  .weak-list li{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:.5em .7em;font-size:.95rem}
  .xgame{
    display:inline-flex;align-items:center;gap:.4em;margin-top:.4em;text-decoration:none;
    background:rgba(73,117,138,.14);border:1px solid rgba(73,117,138,.45);color:var(--noun);
    padding:.55em .9em;border-radius:999px;font-size:.92rem;
  }
  html[data-theme="dark"] .xgame{color:#8fbdd2}
  .sum-actions{display:flex;gap:.6em;flex-wrap:wrap;margin-top:1em}

  .hidden{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* animations (disabled under reduced motion) */
  @keyframes press-in{0%{transform:scale(1)}45%{transform:scale(.97)}100%{transform:scale(1)}}
  .press{animation:press-in .28s ease}
  @media (prefers-reduced-motion: reduce){
    .press{animation:none}
    .progress > i{transition:none}
    .primary:active{transform:none}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">🛠️ Bøjningsværkstedet</div>
    <button class="icon-btn" id="btn-dark" type="button" aria-label="Skift mørk tilstand" title="Mørk tilstand">🌙</button>
    <button class="icon-btn" id="btn-sound" type="button" aria-label="Slå lyd til eller fra" title="Lyd">🔊</button>
  </header>

  <!-- ================= START SCREEN ================= -->
  <main id="start-screen" class="card">
    <h1 class="title">Bøjningsværkstedet</h1>
    <p class="lede">Bøj hele navneordsgruppen — former, artikler, tillægsord og mængder.</p>

    <div class="group-label">Vælg værksted</div>
    <div class="modes" id="mode-list" role="group" aria-label="Vælg tilstand"></div>

    <div class="group-label">Niveau</div>
    <div class="chips" id="level-list" role="group" aria-label="Vælg niveau"></div>

    <button class="primary" id="btn-play" type="button">Spil</button>
  </main>

  <!-- ================= PLAY SCREEN ================= -->
  <main id="play-screen" class="card hidden">
    <div class="playbar">
      <button class="icon-btn back" id="btn-back" type="button" aria-label="Tilbage til start" title="Tilbage">✕</button>
      <div class="progress" aria-hidden="true"><i id="progress-fill"></i></div>
      <div class="count" id="progress-count">0/0</div>
    </div>
    <div id="item-host" aria-live="polite"></div>
  </main>

  <!-- ================= SUMMARY SCREEN ================= -->
  <main id="summary-screen" class="card hidden">
    <div id="summary-host"></div>
  </main>
</div>

<!-- shared library + data -->
<script src="../shared/dansk-core.js"></script>
<script src="../shared/data/nouns.js"></script>
<script src="../shared/data/adjectives.js"></script>
<script src="./data.js"></script>
<script>
(function(){
  'use strict';

  var DC = window.DanskCore;
  var DATA = window.BOEJNINGS_DATA || {};
  var NOUNS = window.DANSK_NOUNS || [];

  var GAME_ID = 'boejningsvaerkstedet';
  var ROUND_SIZE = 10;

  // ---- lookups for display context ----
  var ADJ = window.DANSK_ADJECTIVES || [];
  var NOUN_BY_ID = {};
  NOUNS.forEach(function(n){ NOUN_BY_ID[n.id] = n; });
  var ADJ_BY_ID = {};
  ADJ.forEach(function(a){ ADJ_BY_ID[a.id] = a; });

  // ---- mode registry ----
  var MODES = [
    { key:'fire_former',          num:1, name:'Fire former',            meta:'De fire navneordsformer' },
    { key:'byg_navneordet',       num:2, name:'Byg navneordet',         meta:'Byg hele navneordsgruppen' },
    { key:'adjektivvaerkstedet',  num:3, name:'Adjektivværkstedet',     meta:'Tillægsordets bøjning' },
    { key:'sammenligningspressen',num:4, name:'Sammenligningspressen',  meta:'Gradbøjning' },
    { key:'bestemt_ubestemt',     num:5, name:'Bestemt eller ubestemt?',meta:'Bestemthed i kontekst' },
    { key:'maengdevaerkstedet',   num:6, name:'Mængdeværkstedet',       meta:'Mængdeord' }
  ];

  var FORM_META = {
    indefinite_singular:{ row:0, col:0, da:'ubestemt ental',   slug:'indefinite-singular' },
    definite_singular:  { row:1, col:0, da:'bestemt ental',    slug:'definite-singular' },
    indefinite_plural:  { row:0, col:1, da:'ubestemt flertal', slug:'indefinite-plural' },
    definite_plural:    { row:1, col:1, da:'bestemt flertal',  slug:'definite-plural' }
  };
  var FORM_ORDER = ['indefinite_singular','definite_singular','indefinite_plural','definite_plural'];

  var LEVELS = ['A1','A2','B1','B2'];

  // ---- sound theme (prd.md § 2.5) ----
  var SOUND = {
    select:function(){ DC.ui.sound.sequence([{type:'triangle',frequency:500,duration:0.09,gain:0.03}]); },
    correct:function(){ DC.ui.sound.sequence([
      {type:'square',frequency:220,duration:0.06,gain:0.05},
      {type:'triangle',frequency:330,duration:0.07,gain:0.06,delay:0.07},
      {type:'sine',frequency:494,duration:0.10,gain:0.05,delay:0.14}
    ]); },
    wrong:function(){ DC.ui.sound.sequence([{type:'triangle',frequency:140,duration:0.15,gain:0.04}]); },
    roundComplete:function(){ DC.ui.sound.sequence([
      {type:'square',frequency:220,duration:0.08,gain:0.06},
      {type:'square',frequency:220,duration:0.08,gain:0.06,delay:0.15},
      {type:'square',frequency:220,duration:0.08,gain:0.06,delay:0.30},
      {type:'sine',frequency:330,duration:0.40,gain:0.07,delay:0.45}
    ]); }
  };

  // ---- persisted preferences ----
  var prefs = DC.store.namespace(GAME_ID);
  var srsState = DC.srs.load(GAME_ID);

  // ---- app state ----
  var state = {
    mode: 'fire_former',
    levels: LEVELS.slice(),
    round: [],      // array of item objects
    idx: 0,
    correct: 0,
    missed: []      // item objects answered wrong (for Gentag fejl + weak list)
  };

  // ---- element refs ----
  var el = {
    start:   document.getElementById('start-screen'),
    play:    document.getElementById('play-screen'),
    summary: document.getElementById('summary-screen'),
    modeList:document.getElementById('mode-list'),
    levelList:document.getElementById('level-list'),
    itemHost:document.getElementById('item-host'),
    sumHost: document.getElementById('summary-host'),
    fill:    document.getElementById('progress-fill'),
    pcount:  document.getElementById('progress-count')
  };

  // ---- init settings ----
  DC.ui.darkMode.init();
  DC.ui.sound.init(prefs.get('sound') !== false);
  syncSoundIcon();

  // restore last mode/levels if present
  var savedMode = prefs.get('mode');
  if (savedMode && MODES.some(function(m){ return m.key === savedMode; })) state.mode = savedMode;
  var savedLevels = prefs.get('levels');
  if (Array.isArray(savedLevels) && savedLevels.length) {
    state.levels = savedLevels.filter(function(l){ return LEVELS.indexOf(l) !== -1; });
    if (!state.levels.length) state.levels = LEVELS.slice();
  }

  document.getElementById('btn-dark').addEventListener('click', function(){ DC.ui.darkMode.toggle(); });
  document.getElementById('btn-sound').addEventListener('click', function(){
    var on = DC.ui.sound.toggle();
    prefs.set('sound', on);
    syncSoundIcon();
    if (on) SOUND.select();
  });
  function syncSoundIcon(){
    document.getElementById('btn-sound').textContent = DC.ui.sound.isEnabled() ? '🔊' : '🔇';
  }

  document.getElementById('btn-play').addEventListener('click', startRound);
  document.getElementById('btn-back').addEventListener('click', showStart);

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !el.play.classList.contains('hidden')) {
      showStart();
    }
  });

  // ---- build start-screen controls ----
  function buildStartControls(){
    // modes
    el.modeList.innerHTML = '';
    MODES.forEach(function(m){
      var pool = poolFor(m.key, LEVELS); // total available regardless of level filter
      var ready = pool.length > 0;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mode-btn';
      btn.setAttribute('aria-pressed', String(m.key === state.mode));
      if (!ready) { btn.disabled = true; btn.title = 'Kommer snart'; }
      btn.innerHTML = '<span class="num">' + m.num + '</span>' +
        '<span class="mtxt"><span class="mname">' + m.name + '</span>' +
        '<span class="mmeta"> · ' + m.meta + (ready ? '' : ' · kommer snart') + '</span></span>';
      btn.addEventListener('click', function(){
        if (btn.disabled) return;
        state.mode = m.key;
        prefs.set('mode', m.key);
        updateModePressed();
      });
      el.modeList.appendChild(btn);
    });
    updateModePressed();

    // levels
    el.levelList.innerHTML = '';
    LEVELS.forEach(function(lvl){
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip';
      c.textContent = lvl;
      c.setAttribute('aria-pressed', String(state.levels.indexOf(lvl) !== -1));
      c.addEventListener('click', function(){
        var i = state.levels.indexOf(lvl);
        if (i === -1) state.levels.push(lvl);
        else if (state.levels.length > 1) state.levels.splice(i, 1); // keep at least one
        c.setAttribute('aria-pressed', String(state.levels.indexOf(lvl) !== -1));
        prefs.set('levels', state.levels.slice());
      });
      el.levelList.appendChild(c);
    });
  }

  function updateModePressed(){
    var btns = el.modeList.querySelectorAll('.mode-btn');
    for (var i=0;i<btns.length;i++){
      btns[i].setAttribute('aria-pressed', String(MODES[i].key === state.mode));
    }
  }

  function poolFor(modeKey, levels){
    var all = Array.isArray(DATA[modeKey]) ? DATA[modeKey] : [];
    return DC.level.filter(all, levels);
  }

  // ---- screen switching ----
  function show(which){
    el.start.classList.toggle('hidden', which !== 'start');
    el.play.classList.toggle('hidden', which !== 'play');
    el.summary.classList.toggle('hidden', which !== 'summary');
  }
  function showStart(){
    clearKeyHandler();
    buildStartControls();
    show('start');
    document.getElementById('btn-play').focus();
  }

  // ---- round lifecycle ----
  function buildRound(pool){
    // Prefer SRS-due items, then pad with the rest (shuffled) up to ROUND_SIZE.
    var due = DC.srs.nextItems(srsState, shuffle(pool.slice()), ROUND_SIZE);
    var chosen = due.slice();
    if (chosen.length < ROUND_SIZE) {
      var seen = {};
      chosen.forEach(function(it){ seen[it.id] = true; });
      var rest = shuffle(pool.filter(function(it){ return !seen[it.id]; }));
      for (var i=0; i<rest.length && chosen.length<ROUND_SIZE; i++) chosen.push(rest[i]);
    }
    return chosen;
  }

  function startRound(){
    var pool = poolFor(state.mode, state.levels);
    if (!pool.length) {
      // No data for this mode/level yet — show a graceful empty state.
      show('play');
      renderEmpty();
      return;
    }
    state.round = buildRound(pool);
    state.idx = 0;
    state.correct = 0;
    state.missed = [];
    show('play');
    renderItem();
  }

  function renderEmpty(){
    el.fill.style.width = '0%';
    el.pcount.textContent = '';
    el.itemHost.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'empty-state';
    box.innerHTML = '<span class="big">🛠️</span>' +
      '<p>Denne tilstand er endnu ikke klar. Prøv <strong>Fire former</strong>.</p>';
    var back = document.createElement('button');
    back.className = 'btn accent';
    back.type = 'button';
    back.textContent = 'Tilbage';
    back.addEventListener('click', showStart);
    box.appendChild(back);
    el.itemHost.appendChild(box);
    back.focus();
  }

  function updateProgress(){
    var pct = state.round.length ? Math.round((state.idx / state.round.length) * 100) : 0;
    el.fill.style.width = pct + '%';
    el.pcount.textContent = (state.idx + 1) + '/' + state.round.length;
  }

  // Per-item keyboard handler (number keys for MC options). Cleared before
  // each new item so it never leaks across items or after Escape.
  var activeKeyHandler = null;
  function clearKeyHandler(){
    if (activeKeyHandler){ document.removeEventListener('keydown', activeKeyHandler); activeKeyHandler = null; }
  }

  function renderItem(){
    clearKeyHandler();
    if (state.idx >= state.round.length) { finishRound(); return; }
    updateProgress();
    var item = state.round[state.idx];
    // Modes 5 & 6 items (bestemt_ubestemt, maengdevaerkstedet) legitimately
    // omit a `mode` field per prd § 2.4, so fall back to the round's mode.
    var renderer = RENDERERS[item.mode || state.mode] || RENDERERS._fallback;
    renderer(item);
  }

  function advance(){
    state.idx++;
    renderItem();
  }

  function finishRound(){
    el.fill.style.width = '100%';
    SOUND.roundComplete();
    renderSummary();
    show('summary');
  }

  // ---- answer bookkeeping (shared by all modes) ----
  function recordAnswer(item, correct, patternKey){
    DC.srs.record(srsState, item.id, correct);
    if (patternKey) DC.srs.pattern(srsState, patternKey, correct);
    if (correct) state.correct++;
    else state.missed.push(item);
  }

  // =====================================================================
  //  Mode renderers
  // =====================================================================
  var RENDERERS = {};

  // ---- Mode 1 — Fire former (2×2 grid, free-text) --------------------
  RENDERERS.fire_former = function(item){
    var noun = NOUN_BY_ID[item.noun_id] || {};
    var fm = FORM_META[item.requested_form] || FORM_META.indefinite_singular;
    var patternKey = 'pattern:' + GAME_ID + ':noun:' + fm.slug + ':' + (noun.plural_pattern || 'unknown');

    el.itemHost.innerHTML = '';
    var wrap = document.createElement('div');

    // material header
    var material = document.createElement('div');
    material.className = 'material';
    var lemma = document.createElement('span');
    lemma.className = 'lemma';
    lemma.textContent = noun.base || item.noun_id;
    material.appendChild(lemma);
    var gtag = document.createElement('span');
    gtag.className = 'gender-tag';
    gtag.textContent = (noun.gender || '') + '-ord';
    material.appendChild(gtag);
    DC.ui.ttsButton(noun.base || item.noun_id, material);
    wrap.appendChild(material);

    var ask = document.createElement('p');
    ask.className = 'ask';
    ask.textContent = 'Skriv formen: ' + fm.da + '.';
    wrap.appendChild(ask);

    // 2×2 grid
    var table = document.createElement('table');
    table.className = 'grid';
    table.innerHTML =
      '<thead><tr><th></th><th>Ental</th><th>Flertal</th></tr></thead>';
    var tbody = document.createElement('tbody');
    var rowLabels = ['Ubestemt','Bestemt'];
    var targetCell = null;
    for (var r=0; r<2; r++){
      var tr = document.createElement('tr');
      var th = document.createElement('th');
      th.className = 'rowh';
      th.textContent = rowLabels[r];
      tr.appendChild(th);
      for (var c=0; c<2; c++){
        var td = document.createElement('td');
        if (r === fm.row && c === fm.col){
          td.className = 'target';
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'answer';
          input.setAttribute('aria-label', 'Skriv ' + fm.da);
          input.setAttribute('autocomplete','off');
          input.setAttribute('autocapitalize','off');
          input.spellcheck = false;
          td.appendChild(input);
          targetCell = td;
          wrap._input = input;
        } else {
          td.className = 'filled';
          td.textContent = '·';
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    wrap.appendChild(table);

    // answer button row
    var row = document.createElement('div');
    row.className = 'answer-row';
    var submit = document.createElement('button');
    submit.className = 'btn accent';
    submit.type = 'button';
    submit.textContent = 'Sæt i pressen';
    row.appendChild(submit);
    wrap.appendChild(row);

    var slip = document.createElement('div');
    wrap.appendChild(slip);
    el.itemHost.appendChild(wrap);

    var input = wrap._input;
    var answered = false;

    function submitAnswer(){
      if (answered) return;
      var val = input.value;
      if (!val || !val.trim()) { input.focus(); return; }
      answered = true;
      var res = DC.diff.check(val, item.accepted_answers);
      input.disabled = true;
      submit.disabled = true;
      targetCell.textContent = '';
      var shown = document.createElement('span');
      shown.textContent = res.correct ? val.trim() : (item.accepted_answers[0] || '');
      targetCell.appendChild(shown);
      targetCell.classList.add(res.correct ? 'done-correct' : 'done-wrong');
      recordAnswer(item, res.correct, patternKey);

      var solution = item.accepted_answers[0] || '';
      if (res.correct){
        SOUND.correct();
        if (!DC.ui.motion.isReduced()) table.classList.add('press');
        DC.ui.announce('Rigtigt.');
        buildSlip(slip, true, solution, item.note, null);
        window.setTimeout(advance, 800);
      } else {
        SOUND.wrong();
        DC.ui.announce('Forkert. Rigtigt svar: ' + solution);
        buildSlip(slip, false, solution, item.note, advance);
      }
    }

    submit.addEventListener('click', submitAnswer);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); submitAnswer(); }
    });
    input.focus();
  };

  // ---- Mode 3 — Adjektivværkstedet (adjective agreement, free-text) ----
  function adjContext(item){
    var g = item.gender, d = item.definiteness, n = item.number;
    var tags = [];
    if (g === 'common') tags.push('en-ord');
    else if (g === 'neuter') tags.push('et-ord');
    tags.push(d === 'definite' ? 'bestemt' : 'ubestemt');
    tags.push(n === 'plural' ? 'flertal' : 'ental');
    var frame;
    if (n === 'plural') frame = 'flere';
    else if (d === 'definite') frame = (g === 'neuter') ? 'det' : 'den';
    else frame = (g === 'neuter') ? 'et' : 'en';
    return { tags: tags, frame: frame, slug: (g || 'plural') + '-' + d + '-' + n };
  }

  RENDERERS.adjektivvaerkstedet = function(item){
    var adj = ADJ_BY_ID[item.adjective_id] || {};
    var ctx = adjContext(item);
    var patternKey = 'pattern:' + GAME_ID + ':adj:' + ctx.slug;
    var solution = item.accepted_answers[0] || '';

    el.itemHost.innerHTML = '';
    var wrap = document.createElement('div');

    var material = document.createElement('div');
    material.className = 'material';
    var lemma = document.createElement('span');
    lemma.className = 'adj-lemma';
    lemma.textContent = adj.base || item.adjective_id;
    material.appendChild(lemma);
    DC.ui.ttsButton(adj.base || item.adjective_id, material);
    wrap.appendChild(material);

    var tagRow = document.createElement('div');
    tagRow.className = 'feat-tags';
    ctx.tags.forEach(function(t){
      var s = document.createElement('span'); s.className = 'feat-tag'; s.textContent = t; tagRow.appendChild(s);
    });
    wrap.appendChild(tagRow);

    var frame = document.createElement('div');
    frame.className = 'frame';
    frame.appendChild(document.createTextNode(ctx.frame + ' '));
    var blank = document.createElement('span');
    blank.className = 'blank'; blank.textContent = '?';
    frame.appendChild(blank);
    frame.appendChild(document.createTextNode(' …'));
    wrap.appendChild(frame);

    var ask = document.createElement('p');
    ask.className = 'ask';
    ask.textContent = 'Skriv tillægsordet i den rigtige form.';
    wrap.appendChild(ask);

    var row = document.createElement('div');
    row.className = 'answer-row';
    var input = document.createElement('input');
    input.type = 'text'; input.className = 'answer';
    input.setAttribute('aria-label', 'Skriv tillægsordets form');
    input.setAttribute('autocomplete', 'off'); input.setAttribute('autocapitalize', 'off'); input.spellcheck = false;
    row.appendChild(input);
    var submit = document.createElement('button');
    submit.className = 'btn accent'; submit.type = 'button'; submit.textContent = 'Bøj';
    row.appendChild(submit);
    wrap.appendChild(row);

    var slip = document.createElement('div');
    wrap.appendChild(slip);
    el.itemHost.appendChild(wrap);

    var answered = false;
    function submitAnswer(){
      if (answered) return;
      var val = input.value;
      if (!val || !val.trim()){ input.focus(); return; }
      answered = true;
      var res = DC.diff.check(val, item.accepted_answers);
      input.disabled = true; submit.disabled = true;
      blank.textContent = res.correct ? val.trim() : solution;
      blank.style.borderBottomColor = res.correct ? 'var(--correct)' : 'var(--wrong)';
      recordAnswer(item, res.correct, patternKey);
      if (res.correct){
        SOUND.correct();
        if (!DC.ui.motion.isReduced()) frame.classList.add('press');
        DC.ui.announce('Rigtigt.');
        buildSlip(slip, true, solution, item.note, null);
        window.setTimeout(advance, 800);
      } else {
        SOUND.wrong();
        DC.ui.announce('Forkert. Rigtigt svar: ' + solution);
        buildSlip(slip, false, solution, item.note, advance);
      }
    }
    submit.addEventListener('click', submitAnswer);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); submitAnswer(); } });
    input.focus();
  };

  // ---- Mode 2 — Byg navneordet (tap-to-place tile workbench) ----
  var SLOT_CAPS = ['artikel', 'tillægsord', 'navneord'];
  function phraseFeatureTags(f){
    return [
      f.definiteness === 'definite' ? 'bestemt' : 'ubestemt',
      f.number === 'plural' ? 'flertal' : 'ental',
      f.gender === 'neuter' ? 'et-ord' : 'en-ord'
    ];
  }
  RENDERERS.byg_navneordet = function(item){
    var order = (item.accepted_orders && item.accepted_orders[0]) || [];
    var slotCount = order.length || 3;
    var featSlug = item.features.definiteness + '-' + item.features.number + '-' + item.features.gender;
    var patternKey = 'pattern:' + GAME_ID + ':phrase:' + featSlug;
    var solution = order.join(' ');

    el.itemHost.innerHTML = '';
    var wrap = document.createElement('div');

    var tagRow = document.createElement('div');
    tagRow.className = 'feat-tags';
    phraseFeatureTags(item.features).forEach(function(t){
      var s = document.createElement('span'); s.className = 'feat-tag'; s.textContent = t; tagRow.appendChild(s);
    });
    wrap.appendChild(tagRow);
    var ask = document.createElement('p');
    ask.className = 'ask';
    ask.textContent = 'Byg navneordsgruppen — tryk på brikkerne i rigtig rækkefølge.';
    wrap.appendChild(ask);

    var bench = document.createElement('div');
    bench.className = 'workbench';
    var slotEls = [];
    for (var i = 0; i < slotCount; i++){
      var col = document.createElement('div'); col.className = 'slot-col';
      var cap = document.createElement('span'); cap.className = 'slot-cap';
      cap.textContent = SLOT_CAPS[i] || ('#' + (i + 1));
      col.appendChild(cap);
      var slot = document.createElement('button'); slot.type = 'button'; slot.className = 'slot';
      slot.setAttribute('aria-label', (SLOT_CAPS[i] || 'plads') + ' (tom)');
      col.appendChild(slot); bench.appendChild(col); slotEls.push(slot);
    }
    wrap.appendChild(bench);

    var tray = document.createElement('div'); tray.className = 'tray';
    wrap.appendChild(tray);
    var slip = document.createElement('div'); wrap.appendChild(slip);
    el.itemHost.appendChild(wrap);

    var placed = new Array(slotCount);
    var placedFrom = new Array(slotCount);
    var tileBtns = [];
    var answered = false;

    shuffle(item.pieces.slice()).forEach(function(tok){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.textContent = tok;
      b.addEventListener('click', function(){ if (!answered) placeTile(b, tok); });
      tileBtns.push(b); tray.appendChild(b);
    });

    function nextEmpty(){ for (var i = 0; i < slotCount; i++){ if (!placed[i]) return i; } return -1; }
    function placeTile(btn, tok){
      var i = nextEmpty(); if (i === -1) return;
      placed[i] = tok; placedFrom[i] = btn; btn.disabled = true;
      var slot = slotEls[i];
      slot.textContent = tok; slot.classList.add('filled');
      slot.setAttribute('aria-label', (SLOT_CAPS[i] || 'plads') + ': ' + tok + ' — tryk for at fjerne');
      SOUND.select();
      if (nextEmpty() === -1) check();
    }
    slotEls.forEach(function(slot, i){
      slot.addEventListener('click', function(){
        if (answered || !placed[i]) return;
        if (placedFrom[i]) placedFrom[i].disabled = false;
        placed[i] = null; placedFrom[i] = null;
        slot.textContent = ''; slot.classList.remove('filled');
        slot.setAttribute('aria-label', (SLOT_CAPS[i] || 'plads') + ' (tom)');
      });
    });

    function check(){
      answered = true;
      var correct = placed.join(' ') === solution;
      slotEls.forEach(function(s){ s.classList.add(correct ? 'done-correct' : 'done-wrong'); });
      tileBtns.forEach(function(b){ b.disabled = true; });
      recordAnswer(item, correct, patternKey);
      if (correct){
        SOUND.correct();
        if (!DC.ui.motion.isReduced()) bench.classList.add('press');
        DC.ui.announce('Rigtigt.');
        buildSlip(slip, true, solution, item.note, null);
        window.setTimeout(advance, 800);
      } else {
        SOUND.wrong();
        DC.ui.announce('Forkert. Rigtigt svar: ' + solution);
        buildSlip(slip, false, solution, item.note, advance);
      }
    }

    if (tileBtns[0]) tileBtns[0].focus();
  };

  // ---- Mode 4 — Sammenligningspressen (three-slot comparison, free-text) ----
  var CMP_SLOTS = ['grundform','komparativ','superlativ'];
  RENDERERS.sammenligningspressen = function(item){
    var adj = ADJ_BY_ID[item.adjective_id] || {};
    var patternKey = 'pattern:' + GAME_ID + ':comparison:' + (item.comparison_type || 'regular');
    var solution = item.slots.map(function(s){ return s.accepted_answers[0]; }).join(' → ');

    el.itemHost.innerHTML = '';
    var wrap = document.createElement('div');

    var material = document.createElement('div');
    material.className = 'material';
    var lemma = document.createElement('span');
    lemma.className = 'adj-lemma';
    lemma.textContent = adj.base || item.adjective_id;
    material.appendChild(lemma);
    DC.ui.ttsButton(adj.base || item.adjective_id, material);
    wrap.appendChild(material);

    var ask = document.createElement('p');
    ask.className = 'ask';
    ask.textContent = 'Gradbøj tillægsordet: grundform → komparativ → superlativ.';
    wrap.appendChild(ask);

    var row = document.createElement('div');
    row.className = 'press-row';
    var inputs = [];
    item.slots.forEach(function(slot, i){
      if (i > 0){
        var arr = document.createElement('span');
        arr.className = 'arrow'; arr.setAttribute('aria-hidden','true'); arr.textContent = '→';
        row.appendChild(arr);
      }
      var col = document.createElement('div'); col.className = 'press-col';
      var cap = document.createElement('span'); cap.className = 'slot-cap';
      cap.textContent = slot.label || CMP_SLOTS[i] || ('#' + (i + 1));
      col.appendChild(cap);
      var input = document.createElement('input');
      input.type = 'text'; input.className = 'slot-input';
      input.setAttribute('aria-label', slot.label);
      input.setAttribute('autocomplete','off'); input.setAttribute('autocapitalize','off');
      input.spellcheck = false;
      if (i === 0){ input.value = (adj.base || ''); }  // grundform pre-filled as the shown lemma
      col.appendChild(input);
      row.appendChild(col);
      inputs.push(input);
    });
    wrap.appendChild(row);

    var actions = document.createElement('div');
    actions.className = 'answer-row';
    var submit = document.createElement('button');
    submit.className = 'btn accent'; submit.type = 'button'; submit.textContent = 'Sæt i pressen';
    actions.appendChild(submit);
    wrap.appendChild(actions);

    var slip = document.createElement('div'); wrap.appendChild(slip);
    el.itemHost.appendChild(wrap);

    var answered = false;
    function submitAnswer(){
      if (answered) return;
      // require every slot filled
      for (var k=0;k<inputs.length;k++){ if (!inputs[k].value.trim()){ inputs[k].focus(); return; } }
      answered = true;
      var allCorrect = true;
      item.slots.forEach(function(slot, i){
        var res = DC.diff.check(inputs[i].value, slot.accepted_answers);
        inputs[i].disabled = true;
        inputs[i].classList.add(res.correct ? 'done-correct' : 'done-wrong');
        if (!res.correct){ inputs[i].value = slot.accepted_answers[0]; allCorrect = false; }
      });
      submit.disabled = true;
      recordAnswer(item, allCorrect, patternKey);
      if (allCorrect){
        SOUND.correct();
        if (!DC.ui.motion.isReduced()) row.classList.add('press');
        DC.ui.announce('Rigtigt.');
        buildSlip(slip, true, solution, item.note, null);
        window.setTimeout(advance, 800);
      } else {
        SOUND.wrong();
        DC.ui.announce('Forkert. Rigtigt svar: ' + solution);
        buildSlip(slip, false, solution, item.note, advance);
      }
    }
    submit.addEventListener('click', submitAnswer);
    inputs.forEach(function(inp, i){
      inp.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){
          e.preventDefault();
          if (i < inputs.length - 1 && !inputs[i+1].value.trim()){ inputs[i+1].focus(); }
          else submitAnswer();
        }
      });
    });
    inputs[1] ? inputs[1].focus() : inputs[0].focus();  // grundform pre-filled; start at komparativ
  };

  // ---- Modes 5 & 6 — multiple choice in context -----------------------
  // Mode 5 (bestemt_ubestemt) and Mode 6 (maengdevaerkstedet) share the same
  // interaction: a short context with a blank + option buttons.
  function makeMcRenderer(patternType){
    return function(item){
      var patternKey = 'pattern:' + GAME_ID + ':' + patternType + ':' + (item.pattern || 'general');
      var ttsText = String(item.context || '').replace(/_{2,}/g, ' … ');

      el.itemHost.innerHTML = '';
      var wrap = document.createElement('div');

      // context with a visible blank
      var ctx = document.createElement('div');
      ctx.className = 'context';
      var blank = null;
      var parts = String(item.context || '').split(/_{2,}/);
      parts.forEach(function(seg, i){
        ctx.appendChild(document.createTextNode(seg));
        if (i < parts.length - 1){
          blank = document.createElement('span');
          blank.className = 'blank'; blank.textContent = '?';
          ctx.appendChild(blank);
        }
      });
      wrap.appendChild(ctx);

      // TTS replay for the context prompt
      var ttsRow = document.createElement('div');
      ttsRow.className = 'answer-row';
      DC.ui.ttsButton(ttsText, ttsRow);
      wrap.appendChild(ttsRow);

      var opts = document.createElement('div');
      opts.className = 'options';
      opts.setAttribute('role','group');
      opts.setAttribute('aria-label','Svarmuligheder');
      wrap.appendChild(opts);

      var slip = document.createElement('div'); wrap.appendChild(slip);
      el.itemHost.appendChild(wrap);

      var buttons = [];
      var answered = false;
      item.options.forEach(function(optText, i){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt';
        b.innerHTML = '<span class="onum">' + (i + 1) + '</span>' +
          '<span class="otxt">' + escapeHtml(optText) + '</span>';
        b.addEventListener('click', function(){ choose(i); });
        buttons.push(b); opts.appendChild(b);
      });

      function choose(i){
        if (answered) return;
        answered = true;
        clearKeyHandler();
        var chosen = item.options[i];
        var correct = DC.diff.normalize(chosen) === DC.diff.normalize(item.correct);
        buttons.forEach(function(b, j){
          b.disabled = true;
          if (j === i) b.classList.add(correct ? 'chosen-correct' : 'chosen-wrong');
          if (!correct && DC.diff.normalize(item.options[j]) === DC.diff.normalize(item.correct)){
            b.classList.add('reveal-correct');
          }
        });
        if (blank){
          blank.textContent = item.correct;
          blank.classList.add(correct ? 'done-correct' : 'done-wrong');
        }
        recordAnswer(item, correct, patternKey);
        if (correct){
          SOUND.correct();
          if (!DC.ui.motion.isReduced()) ctx.classList.add('press');
          DC.ui.announce('Rigtigt.');
          buildSlip(slip, true, item.correct, item.note, null);
          window.setTimeout(advance, 800);
        } else {
          SOUND.wrong();
          DC.ui.announce('Forkert. Rigtigt svar: ' + item.correct);
          buildSlip(slip, false, item.correct, item.note, advance);
        }
      }

      activeKeyHandler = function(e){
        if (answered) return;
        var n = parseInt(e.key, 10);
        if (n >= 1 && n <= buttons.length){ e.preventDefault(); choose(n - 1); }
      };
      document.addEventListener('keydown', activeKeyHandler);
      if (buttons[0]) buttons[0].focus();
    };
  }
  RENDERERS.bestemt_ubestemt = makeMcRenderer('definiteness');
  RENDERERS.maengdevaerkstedet = makeMcRenderer('quantifier');

  RENDERERS._fallback = function(){ renderEmpty(); };

  // ---- proofing slip (feedback) ----
  // solutionText: the correct target form/phrase (used for the wrong-answer
  // line and the TTS replay button). noteText: one grammar note.
  function buildSlip(host, correct, solutionText, noteText, onNext){
    host.innerHTML = '';
    var slip = document.createElement('div');
    slip.className = 'slip ' + (correct ? 'correct' : 'wrong');

    if (!correct){
      var sol = document.createElement('div');
      sol.innerHTML = 'Rigtigt svar: <span class="sol bad">' +
        escapeHtml(solutionText || '') + '</span>';
      slip.appendChild(sol);
    }
    if (noteText){
      var note = document.createElement('div');
      note.className = 'note';
      note.textContent = noteText;
      slip.appendChild(note);
    }

    var actions = document.createElement('div');
    actions.className = 'actions';
    // TTS replay for the correct target form/phrase
    if (solutionText) DC.ui.ttsButton(solutionText, actions);

    if (typeof onNext === 'function'){
      var next = document.createElement('button');
      next.className = 'btn accent';
      next.type = 'button';
      next.textContent = 'Videre';
      next.addEventListener('click', onNext);
      actions.appendChild(next);
      slip.appendChild(actions);
      host.appendChild(slip);
      next.focus();
      // Enter advances too
      slip.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); onNext(); }
      });
    } else {
      slip.appendChild(actions);
      host.appendChild(slip);
    }
  }

  // =====================================================================
  //  Round summary
  // =====================================================================
  function renderSummary(){
    var total = state.round.length;
    var acc = total ? Math.round((state.correct / total) * 100) : 0;
    el.sumHost.innerHTML = '';

    var h = document.createElement('div');
    h.className = 'sum-head';
    h.textContent = 'Runden er færdig';
    el.sumHost.appendChild(h);

    var stats = document.createElement('div');
    stats.className = 'sum-stats';
    stats.innerHTML =
      '<div class="stat"><b>' + state.correct + '/' + total + '</b><span>Rigtige</span></div>' +
      '<div class="stat"><b>' + acc + '%</b><span>Præcision</span></div>';
    el.sumHost.appendChild(stats);

    // up to 3 weakest items
    var weak = uniqueMissed().slice(0, 3);
    if (weak.length){
      var wl = document.createElement('div');
      wl.className = 'group-label';
      wl.textContent = 'Øv disse igen';
      el.sumHost.appendChild(wl);
      var ul = document.createElement('ul');
      ul.className = 'weak-list';
      weak.forEach(function(item){
        var li = document.createElement('li');
        li.textContent = weakLabel(item);
        ul.appendChild(li);
      });
      el.sumHost.appendChild(ul);
    }

    // one cross-game recommendation chip (prd § Cross-Game Curriculum Links)
    var chip = crossGameChip(acc);
    if (chip) el.sumHost.appendChild(chip);

    // actions
    var actions = document.createElement('div');
    actions.className = 'sum-actions';

    var again = document.createElement('button');
    again.className = 'primary';
    again.style.marginTop = '0';
    again.style.width = 'auto';
    again.type = 'button';
    again.textContent = 'Spil igen';
    again.addEventListener('click', startRound);
    actions.appendChild(again);

    if (state.missed.length){
      var retry = document.createElement('button');
      retry.className = 'btn';
      retry.type = 'button';
      retry.textContent = 'Gentag fejl';
      retry.addEventListener('click', function(){
        state.round = uniqueMissed();
        state.idx = 0;
        state.correct = 0;
        state.missed = [];
        show('play');
        renderItem();
      });
      actions.appendChild(retry);
    }

    var home = document.createElement('button');
    home.className = 'btn';
    home.type = 'button';
    home.textContent = 'Til start';
    home.addEventListener('click', showStart);
    actions.appendChild(home);

    el.sumHost.appendChild(actions);
    again.focus();
  }

  function uniqueMissed(){
    var seen = {}, out = [];
    state.missed.forEach(function(it){
      if (!seen[it.id]){ seen[it.id] = true; out.push(it); }
    });
    return out;
  }

  function weakLabel(item){
    // Effective mode — Modes 5 & 6 items carry no `mode` field (prd § 2.4).
    var mode = item.mode || state.mode;
    if (mode === 'fire_former'){
      var noun = NOUN_BY_ID[item.noun_id] || {};
      var fm = FORM_META[item.requested_form];
      return (noun.base || item.noun_id) + ' → ' + (item.accepted_answers[0] || '') +
        (fm ? ' (' + fm.da + ')' : '');
    }
    if (mode === 'adjektivvaerkstedet'){
      var adj = ADJ_BY_ID[item.adjective_id] || {};
      return (adj.base || item.adjective_id) + ' → ' + (item.accepted_answers[0] || '');
    }
    if (mode === 'byg_navneordet'){
      return (item.accepted_orders && item.accepted_orders[0]) ? item.accepted_orders[0].join(' ') : item.id;
    }
    if (mode === 'sammenligningspressen'){
      var adj4 = ADJ_BY_ID[item.adjective_id] || {};
      var cmp = (item.slots && item.slots[1] && item.slots[1].accepted_answers[0]) || '';
      var sup = (item.slots && item.slots[2] && item.slots[2].accepted_answers[0]) || '';
      return (adj4.base || item.adjective_id) + ' → ' + cmp + ' → ' + sup;
    }
    if (mode === 'bestemt_ubestemt' || mode === 'maengdevaerkstedet'){
      return item.correct || item.id;
    }
    return item.accepted_answers ? (item.accepted_answers[0] || item.id) : item.id;
  }

  function crossGameChip(acc){
    // Recommend the gender trainer when accuracy is low on noun forms.
    if (acc >= 70) return null;
    if (state.mode !== 'fire_former') return null;
    var a = document.createElement('a');
    a.className = 'xgame';
    a.href = '../en og et/index.html';
    a.textContent = '🔎 Problemer med navneordsformer? → En/Et-træner';
    return a;
  }

  // ---- helpers ----
  function shuffle(arr){
    for (var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch];
    });
  }

  // ---- boot ----
  buildStartControls();
})();
</script>
