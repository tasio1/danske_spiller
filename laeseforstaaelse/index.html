<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Læseforståelse – øv læsning på dansk som til Prøve i Dansk 3 | Sjovt Dansk</title>
<meta name="description" content="Læs en dansk artikel og svar på spørgsmål med teksten foran dig hele tiden. Øvelsesopgaver i samme format som Prøve i Dansk 3." />
<script>
/* Apply saved reader prefs before first paint (no flash). Failures are harmless. */
try {
  var r = JSON.parse(window.localStorage.getItem('laeseforstaaelse:reader') || 'null') || {};
  var d = document.documentElement;
  var p = r.paper;
  if (p !== 'light' && p !== 'sepia' && p !== 'dark') {
    p = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  d.setAttribute('data-paper', p);
  if (r.fs === 17 || r.fs === 19 || r.fs === 22) d.style.setProperty('--lf-fs', r.fs + 'px');
} catch (e) { /* storage unavailable */ }
</script>
<link rel="stylesheet" href="../shared/tts-button.css" />
<style>
  /* Reading room, minimal tokens. The designer polishes this later. */
  :root {
    --lf-paper:#F4F0E6; --lf-card:#FBF9F3; --lf-ink:#1E1C1A; --lf-muted:#5E574C; --lf-rule:#CFC6B2;
    --lf-mark:#E0B43C; --lf-mark-ink:#1E1C1A; --lf-accent:#2F6F6B; --lf-focus:#1F5A56;
    --lf-ok:#2F6B45; --lf-ok-bg:rgba(47,107,69,.14); --lf-no:#9B3D3D; --lf-no-bg:rgba(155,61,61,.13);
    --lf-fs:19px; --lf-panel:420px; --lf-sheet:52dvh; --lf-gutter:clamp(36px,4vw,48px);
    --dc-fg:var(--lf-ink); --dc-btn-bg:var(--lf-card); --dc-border:var(--lf-ink); --dc-accent:var(--lf-accent);
    --dc-accent-fg:#fff; --dc-correct:var(--lf-ok); --dc-correct-bg:var(--lf-ok-bg);
    --dc-wrong:var(--lf-no); --dc-wrong-bg:var(--lf-no-bg);
    color-scheme: light;
  }
  :root[data-paper="sepia"] { --lf-paper:#EADFC8; --lf-card:#F2E9D5; --lf-ink:#2B2418; --lf-muted:#574C38; --lf-rule:#C4B592; }
  :root[data-paper="dark"] {
    --lf-paper:#16191C; --lf-card:#1F2328; --lf-ink:#E6E2D8; --lf-muted:#ABA598; --lf-rule:#39414A; --lf-focus:#8FD6CF;
    --lf-ok:#8FCB9F; --lf-ok-bg:rgba(143,203,159,.18); --lf-no:#EE9A9A; --lf-no-bg:rgba(238,154,154,.16);
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--lf-paper); color: var(--lf-ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  :focus-visible, .lf-app .dc-quiz-option:focus-visible { outline: 3px solid var(--lf-focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .lf-app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
  .lf-top { display: flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 56px;
            border-bottom: 2px solid var(--lf-rule); flex-wrap: nowrap; }
  .lf-brand { font-weight: 700; margin: 0 auto 0 0; font-size: 1.05rem; white-space: nowrap; }
  .lf-btn { min-height: 44px; min-width: 44px; padding: 0 12px; background: var(--lf-card); color: var(--lf-ink);
            border: 2px solid var(--lf-ink); border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .lf-btn--primary { background: var(--lf-accent); color: #fff; border-color: var(--lf-accent); font-weight: 700; }
  .lf-btn[aria-pressed="true"], .lf-btn[aria-checked="true"] { background: var(--lf-ink); color: var(--lf-paper); }
  .lf-btn[aria-disabled="true"] { border-style: dashed; cursor: default; }

  /* Start screen */
  .lf-start { overflow-y: auto; overscroll-behavior: contain; padding: 24px 16px; display: flex; flex-direction: column;
              align-items: center; gap: 18px; text-align: center; }
  .lf-start h1 { margin: 8px 0 0; font: 700 clamp(1.8rem, 6vw, 2.6rem)/1.15 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  .lf-start .lf-btn--primary { font-size: 1.25rem; min-width: 180px; min-height: 56px; }
  .lf-ctl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .lf-ctl-label { color: var(--lf-muted); font-size: .9rem; margin-right: 4px; }
  .lf-disclaimer, .lf-msg { max-width: 46ch; margin: 0; color: var(--lf-muted); font-size: .95rem; line-height: 1.5; }
  .lf-msg { color: var(--lf-ink); min-height: 1.5em; }

  /* App frame: the PAGE never scrolls; the two panes do. */
  .lf-main { display: grid; min-height: 0; grid-template-rows: minmax(0, 1fr);
             grid-template-columns: minmax(0, 1fr) minmax(340px, var(--lf-panel)); }
  .lf-reader { position: relative; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
               scrollbar-width: thin; min-height: 0; padding: 24px var(--lf-gutter) 40px; }
  .lf-panel { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; min-height: 0;
              border-left: 2px solid var(--lf-rule); padding: 16px 20px 24px; background: var(--lf-paper); }

  /* Reading column: one measure, centred, system serif. */
  .lf-text { max-width: 29em; margin-inline: auto; font: var(--lf-fs)/1.65 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  .lf-kicker { margin: 0 0 4px; font: 700 .72em/1.4 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--lf-muted); }
  .lf-text h2 { margin: 0 0 .7em; font-size: 1.55em; line-height: 1.25; }
  .lf-text p { margin: 0 0 1em; position: relative; }
  .lf-text p[data-par]::before { content: "¶" attr(data-par); position: absolute; right: 100%; margin-right: 8px;
              font: 700 12px/2.3 ui-monospace, "SF Mono", Consolas, monospace; color: var(--lf-muted); }
  .lf-text p.lf-evidence { background: var(--lf-mark); color: var(--lf-mark-ink); box-shadow: 0 0 0 5px var(--lf-mark); border-radius: 2px; }
  .lf-foot { margin-top: 2em; padding-top: 1em; border-top: 1px solid var(--lf-rule); font: .8em/1.5 system-ui, sans-serif; color: var(--lf-muted); }
  .lf-foot p { margin: 0 0 .6em; }
  .lf-foot summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
  .lf-foot ul { margin: 0; padding-left: 1.2em; }
  .lf-foot a { display: inline-block; min-height: 44px; padding: 12px 0; overflow-wrap: anywhere; color: var(--lf-focus); }

  /* Question pane */
  .lf-panel-head { display: none; }
  .lf-qnum { margin: 0 0 8px; color: var(--lf-muted); font-size: .9rem; font-weight: 700; }
  #lf-q .dc-quiz-prompt { font-size: 1.1rem; line-height: 1.4; font-weight: 600; }
  #lf-q .dc-quiz-option { width: 100%; font-size: 1rem; line-height: 1.4; border-width: 2px; background: var(--lf-card); color: var(--lf-ink); }
  #lf-q .dc-quiz-option:disabled { color: var(--lf-ink); opacity: 1; }
  #lf-q .dc-quiz-option.dc-correct::after { content: " \2713"; font-weight: 700; }
  #lf-q .dc-quiz-option.dc-wrong::after { content: " \2717"; font-weight: 700; }
  .lf-fb-box { margin-top: 12px; padding: 12px; border-left: 4px solid var(--lf-no); background: var(--lf-no-bg); line-height: 1.45; }
  .lf-fb-box p { margin: 0 0 8px; }
  .lf-fb-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .lf-nav { display: flex; gap: 8px; margin-top: 14px; }
  .lf-flash { animation: lf-flash .5s ease-out; }
  @keyframes lf-flash { from { box-shadow: 0 0 0 6px var(--lf-ok-bg); } to { box-shadow: 0 0 0 0 transparent; } }
  .dc-summary-stats { font-size: 1.1rem; font-weight: 700; }

  @media (min-width: 1024px) and (max-width: 1279px) { :root { --lf-panel: 360px; } }
  /* Tablet landscape stays split with a 38 % panel. */
  @media (min-width: 640px) and (max-width: 1023px) and (orientation: landscape) {
    .lf-main { grid-template-columns: minmax(0, 1fr) minmax(300px, 38%); }
  }
  /* Narrow screens: text on top, docked collapsible panel below. */
  @media (max-width: 1023px) and (orientation: portrait), (max-width: 639px) {
    :root { --lf-gutter: 16px; }
    .lf-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .lf-panel { border-left: 0; border-top: 2px solid var(--lf-rule); max-height: var(--lf-sheet); padding: 0 16px 16px; }
    .lf-panel-head { display: block; position: sticky; top: 0; background: var(--lf-paper); padding-top: 6px; z-index: 1; }
    #btn-panel { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; justify-content: space-between; }
    .lf-peek { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lf-panel[data-collapsed="true"] .lf-panel-body { display: none; }
    .lf-qnum { display: none; }
    .lf-text p[data-par]::before { position: static; display: block; margin: 0; line-height: 1.6; }
    .lf-text p.lf-evidence::before { color: #3A3220; }
  }
  @media (min-width: 640px) and (max-width: 1023px) and (orientation: portrait) { :root { --lf-sheet: 46dvh; } }
  @media (max-width: 480px) { .lf-brand { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); } .lf-top { padding: 6px 8px; gap: 4px; } .lf-btn { padding: 0 8px; } }
  @media (prefers-reduced-motion: reduce) { .lf-flash { animation: none; } * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<div class="lf-app">
  <header class="lf-top">
    <p class="lf-brand">Læseforståelse</p>
    <button type="button" class="lf-btn" id="btn-menu" hidden>Menu</button>
    <button type="button" class="lf-btn" id="btn-fs-down" aria-label="Mindre tekst">A−</button>
    <button type="button" class="lf-btn" id="btn-fs-up" aria-label="Større tekst">A+</button>
    <button type="button" class="lf-btn" id="btn-paper" aria-label="Skift papir">Papir</button>
    <button type="button" class="lf-btn" id="btn-sound" aria-label="Lyd til eller fra">Lyd</button>
  </header>

  <section class="lf-start" id="screen-start" aria-label="Start">
    <h1>Læseforståelse</h1>
    <button type="button" class="lf-btn lf-btn--primary" id="btn-play">Spil</button>
    <div class="lf-ctl" id="ctl-mode" role="radiogroup" aria-label="Øvelse"></div>
    <div class="lf-ctl" id="ctl-level" role="group" aria-label="Niveau"><span class="lf-ctl-label">Niveau</span></div>
    <p class="lf-msg" id="start-msg" role="status"></p>
    <p class="lf-disclaimer">Øvelsesopgaver i samme format som Prøve i Dansk 3. Ikke officielt prøvemateriale.</p>
    <button type="button" class="lf-btn" id="btn-reset">Nulstil fremgang</button>
  </section>

  <main class="lf-main" id="screen-play" hidden>
    <section class="lf-reader" id="lf-reader" role="region" tabindex="0" aria-label="Tekst">
      <article class="lf-text" id="lf-text"></article>
    </section>
    <aside class="lf-panel" id="lf-panel" aria-label="Spørgsmål" data-collapsed="false">
      <div class="lf-panel-head">
        <button type="button" class="lf-btn" id="btn-panel" aria-expanded="true" aria-controls="lf-panel-body">
          <span class="lf-peek" id="lf-peek"></span><span aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="lf-panel-body" id="lf-panel-body">
        <p class="lf-qnum" id="lf-qnum"></p>
        <div id="lf-q"></div>
        <div id="lf-fb" aria-live="polite"></div>
        <div class="lf-nav" id="lf-nav">
          <button type="button" class="lf-btn" id="btn-prev" aria-label="Forrige spørgsmål (J)">← Forrige</button>
          <button type="button" class="lf-btn" id="btn-next" aria-label="Næste spørgsmål (K)">Næste →</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<script src="../shared/dansk-speech.js"></script>
<script src="../shared/dansk-core.js"></script>
<script src="data-mc.js"></script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var DC = window.DanskCore;
  var D = window.LAESE_DATA;
  var NS = 'laeseforstaaelse';
  var store = DC.store.namespace(NS);
  var srs = DC.srs.load(NS);
  var FS = [17, 19, 22];
  var PAPERS = ['light', 'sepia', 'dark'];
  var PAPER_LABEL = { light: 'Lys', sepia: 'Sepia', dark: 'Mørk' };
  var LEVELS = ['B1', 'B2'];
  var FOOTER = 'Øvelsestekst skrevet til sprogtræning. Tal og fakta er dokumenterede — se kilder.';

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function btn(label, cls, onClick, aria) {
    var b = el('button', cls || 'lf-btn', label); b.type = 'button';
    if (aria) b.setAttribute('aria-label', aria);
    b.addEventListener('click', onClick); return b;
  }

  var reader = $('lf-reader'), textEl = $('lf-text'), panel = $('lf-panel');
  var qHost = $('lf-q'), fbHost = $('lf-fb'), qnumEl = $('lf-qnum'), peekEl = $('lf-peek');

  var state = { mode: 'mc', levels: LEVELS.slice(), text: null, qi: 0, answered: {}, token: 0,
                view: 'start', summary: false };
  var reading = { fs: 19, paper: 'light' };
  var anchor = { par: 1, offset: 0 };
  var lock = false, lockTimer = 0, saveTimer = 0;

  function availableModes() { return D.modes.filter(function (m) { return m.available; }); }

  /* ---------- reader prefs (text size, paper) ---------- */
  (function loadReading() {
    var r = store.get('reader') || {};
    reading.fs = FS.indexOf(r.fs) !== -1 ? r.fs : 19;
    reading.paper = PAPERS.indexOf(r.paper) !== -1 ? r.paper : (DC.ui.darkMode.init() === 'dark' ? 'dark' : 'light');
  })();
  function applyReading() {
    document.documentElement.setAttribute('data-paper', reading.paper);
    document.documentElement.style.setProperty('--lf-fs', reading.fs + 'px');
    $('btn-paper').textContent = 'Papir: ' + PAPER_LABEL[reading.paper];
    $('btn-paper').setAttribute('aria-label', 'Papir: ' + PAPER_LABEL[reading.paper] + '. Skift papir');
    $('btn-fs-down').setAttribute('aria-disabled', reading.fs === FS[0] ? 'true' : 'false');
    $('btn-fs-up').setAttribute('aria-disabled', reading.fs === FS[FS.length - 1] ? 'true' : 'false');
    $('btn-sound').textContent = DC.ui.sound.isEnabled() ? 'Lyd til' : 'Lyd fra';
  }
  function saveReading() { store.set('reader', { fs: reading.fs, paper: reading.paper }); }
  function stepFs(d) {
    var i = FS.indexOf(reading.fs) + d;
    if (i < 0 || i >= FS.length) return;
    reading.fs = FS[i]; applyReading(); saveReading();
    if (state.view === 'play') applyAnchor(anchor);
  }
  $('btn-fs-down').addEventListener('click', function () { stepFs(-1); });
  $('btn-fs-up').addEventListener('click', function () { stepFs(1); });
  $('btn-paper').addEventListener('click', function () {
    reading.paper = PAPERS[(PAPERS.indexOf(reading.paper) + 1) % PAPERS.length]; applyReading(); saveReading();
  });
  $('btn-sound').addEventListener('click', function () { DC.ui.sound.toggle(); applyReading(); });

  /* ---------- sound cues ---------- */
  var SOUND = {
    correct: function () { DC.ui.sound.sequence([
      { type: 'square', frequency: 220, duration: 0.06, gain: 0.05 },
      { type: 'triangle', frequency: 330, duration: 0.07, gain: 0.06, delay: 0.07 },
      { type: 'sine', frequency: 494, duration: 0.10, gain: 0.05, delay: 0.14 }]); },
    wrong: function () { DC.ui.sound.sequence([{ type: 'triangle', frequency: 140, duration: 0.15, gain: 0.04 }]); },
    done: function () { DC.ui.sound.sequence([
      { type: 'triangle', frequency: 392, duration: 0.1, gain: 0.05 },
      { type: 'triangle', frequency: 523, duration: 0.16, gain: 0.05, delay: 0.1 }]); }
  };

  /* ---------- scroll anchor: top visible paragraph, saved per text ---------- */
  function currentAnchor() {
    var pr = reader.getBoundingClientRect();
    var ps = textEl.querySelectorAll('p[data-par]');
    for (var i = 0; i < ps.length; i++) {
      var r = ps[i].getBoundingClientRect();
      if (r.bottom > pr.top + 4) return { par: +ps[i].getAttribute('data-par'), offset: Math.round(pr.top - r.top) };
    }
    return { par: 1, offset: 0 };
  }
  function applyAnchor(a) {
    var p = textEl.querySelector('[data-par="' + a.par + '"]');
    if (!p) return;
    reader.scrollTop += p.getBoundingClientRect().top - reader.getBoundingClientRect().top + a.offset;
  }
  reader.addEventListener('scroll', function () {
    if (lock || !state.text) return;
    anchor = currentAnchor();
    window.clearTimeout(saveTimer);
    var id = state.text.id, a = anchor;
    saveTimer = window.setTimeout(function () { store.set('scroll:' + id, a); }, 250);
  });
  function reanchor() {
    if (state.view !== 'play') return;
    lock = true; applyAnchor(anchor);
    window.clearTimeout(lockTimer);
    lockTimer = window.setTimeout(function () { applyAnchor(anchor); lock = false; }, 200);
  }
  window.addEventListener('resize', reanchor);
  window.addEventListener('orientationchange', reanchor);

  /* ---------- reading pane ---------- */
  function renderText(text) {
    textEl.innerHTML = '';
    textEl.appendChild(el('p', 'lf-kicker', text.kicker));
    textEl.appendChild(el('h2', null, text.title));
    text.paragraphs.forEach(function (para, i) {
      var p = el('p', null, para); p.setAttribute('data-par', String(i + 1)); textEl.appendChild(p);
    });
    var foot = el('footer', 'lf-foot');
    foot.appendChild(el('p', null, FOOTER));
    var det = el('details'); det.appendChild(el('summary', null, 'Kilder'));
    var ul = el('ul');
    (text.sources || []).forEach(function (u) {
      var li = el('li'), a = el('a', null, u); a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer';
      li.appendChild(a); ul.appendChild(li);
    });
    det.appendChild(ul); foot.appendChild(det); textEl.appendChild(foot);
  }
  function clearHighlight() {
    var o = textEl.querySelectorAll('.lf-evidence');
    for (var i = 0; i < o.length; i++) o[i].classList.remove('lf-evidence');
  }
  // paragraphIndex is 0-based (the data's `evidence`); data-par in the DOM is 1-based.
  function highlight(paragraphIndex) {
    clearHighlight();
    var p = textEl.querySelector('[data-par="' + (paragraphIndex + 1) + '"]');
    if (!p) return;
    p.classList.add('lf-evidence');
    var top = p.getBoundingClientRect().top - reader.getBoundingClientRect().top + reader.scrollTop;
    reader.scrollTo({ top: Math.max(0, top - (reader.clientHeight - p.offsetHeight) / 2),
                      behavior: DC.ui.motion.isReduced() ? 'auto' : 'smooth' });
  }

  /* ---------- round bookkeeping ---------- */
  function recordAnswer(itemId, correct, patternKey, chosen) {
    if (state.answered[itemId]) return;
    state.answered[itemId] = { correct: correct, chosen: chosen };
    DC.srs.record(srs, state.mode + ':' + itemId, correct);   // srs namespace + key = laeseforstaaelse:mc:<question-id>
    if (patternKey) DC.srs.pattern(srs, patternKey, correct);
    (correct ? SOUND.correct : SOUND.wrong)();
  }
  function allAnswered() {
    return D.itemsOf(state.text).every(function (q) { return state.answered[q.id]; });
  }
  function advance(delay, tok) {
    function go() {
      if (tok !== undefined && tok !== state.token) return;
      var items = D.itemsOf(state.text), n = items.length;
      for (var k = 1; k <= n; k++) {
        var i = (state.qi + k) % n;
        if (!state.answered[items[i].id]) { state.qi = i; render(); return; }
      }
      finishRound();
    }
    if (delay > 0) window.setTimeout(go, delay); else go();
  }
  function step(d) {
    if (state.view !== 'play') return;
    var n = D.itemsOf(state.text).length;
    if (state.summary) { if (d < 0) { state.summary = false; render(); } return; }
    var i = state.qi + d;
    if (i < 0) return;
    if (i >= n) { if (allAnswered()) finishRound(); return; }
    state.qi = i; render();
  }
  function setHead(num) { qnumEl.textContent = num; }
  function finishRound() {
    state.token++; state.summary = true; clearHighlight();
    var items = D.itemsOf(state.text), right = 0, weak = [];
    items.forEach(function (q) { if (state.answered[q.id] && state.answered[q.id].correct) right++; else weak.push({ label: q.q }); });
    qHost.innerHTML = ''; fbHost.innerHTML = '';
    setHead('Resultat'); peekEl.textContent = 'Resultat';
    DC.quiz.summary.render({ score: right, accuracy: items.length ? right / items.length * 100 : 0, weakItems: weak.slice(0, 3) },
      qHost, function () { replay(); });
    SOUND.done(); DC.ui.announce('Runden er slut. ' + right + ' af ' + items.length + ' rigtige.');
    var again = qHost.querySelector('.dc-summary-actions button'); if (again) again.focus();
  }
  function replay() {
    state.answered = {}; state.qi = 0; state.summary = false; render();
  }

  /* ---------- mode renderers: MODE_RENDERERS[mode](text, host, api) ---------- */
  var MODE_RENDERERS = {};
  var api = { host: qHost, fb: fbHost, onAnswer: recordAnswer, highlight: highlight, clearHighlight: clearHighlight,
              next: advance, finish: finishRound };

  function seeBtn(q) {
    return btn('Se afsnit ' + (q.evidence + 1), 'lf-btn', function () { highlight(q.evidence); });
  }
  function wrongBox(q, withContinue, a) {
    var box = el('div', 'lf-fb-box');
    var ans = el('p', null, 'Rigtigt svar: '); ans.appendChild(el('strong', null, q.options[q.correct])); box.appendChild(ans);
    box.appendChild(el('p', null, q.note));
    var acts = el('div', 'lf-fb-actions'); acts.appendChild(seeBtn(q));
    var cont = null;
    if (withContinue) {
      var last = !D.itemsOf(state.text).some(function (x) { return !state.answered[x.id]; });
      cont = btn(last ? 'Se resultat' : 'Næste', 'lf-btn lf-btn--primary', function () { a.next(0, state.token); });
      cont.id = 'btn-continue'; acts.appendChild(cont);
    }
    box.appendChild(acts); a.fb.appendChild(box);
    return cont;
  }

  MODE_RENDERERS.mc = function (text, host, a) {
    var q = text.questions[state.qi], n = text.questions.length, tok = ++state.token;
    var rec = state.answered[q.id];
    host.innerHTML = ''; a.fb.innerHTML = ''; a.clearHighlight();
    setHead('Spørgsmål ' + (state.qi + 1) + ' af ' + n);
    peekEl.textContent = (state.qi + 1) + '/' + n + ' · ' + q.q;
    if (rec) {                                   // already answered: static review, no second attempt
      var pr = el('div', 'dc-quiz-prompt'); pr.appendChild(el('span', null, q.q)); DC.ui.ttsButton(q.q, pr);
      host.appendChild(pr);
      var list = el('div', 'dc-quiz-options'); list.setAttribute('role', 'group');
      q.options.forEach(function (o, i) {
        var b = el('div', 'dc-quiz-option', (i + 1) + '. ' + o);
        if (i === q.correct) b.classList.add('dc-correct'); else if (i === rec.chosen) b.classList.add('dc-wrong');
        list.appendChild(b);
      });
      host.appendChild(list);
      if (!rec.correct) wrongBox(q, false, a);
      return;
    }
    DC.quiz.mc.render({ prompt: q.q, options: q.options, correct: q.options[q.correct] }, host, function (correct, option) {
      if (tok !== state.token) return;           // stale handler from a question we left
      if (correct) a.next(800, tok);            // schedule the advance first: sound set-up must not delay it
      a.onAnswer(q.id, correct, null, q.options.indexOf(option));
      if (correct) {
        host.classList.remove('lf-flash'); void host.offsetWidth; host.classList.add('lf-flash');
        DC.ui.announce('Rigtigt.');
      } else {
        DC.ui.announce('Forkert. Rigtigt svar: ' + q.options[q.correct]);
        a.highlight(q.evidence);
        panelCollapse(false);
        var c = wrongBox(q, true, a);
        if (c) c.focus({ preventScroll: true });
      }
    });
  };

  function render() {
    var r = MODE_RENDERERS[state.mode];
    if (r) r(state.text, qHost, api);
    var n = D.itemsOf(state.text).length;
    $('btn-prev').setAttribute('aria-disabled', (state.qi === 0 && !state.summary) ? 'true' : 'false');
    $('btn-next').setAttribute('aria-disabled', (state.qi >= n - 1 && !allAnswered()) ? 'true' : 'false');
  }

  /* ---------- docked panel (narrow screens) ---------- */
  function panelCollapse(on) {
    panel.setAttribute('data-collapsed', on ? 'true' : 'false');
    $('btn-panel').setAttribute('aria-expanded', on ? 'false' : 'true');
  }
  $('btn-panel').addEventListener('click', function () { panelCollapse(panel.getAttribute('data-collapsed') !== 'true'); });
  $('btn-prev').addEventListener('click', function () { step(-1); });
  $('btn-next').addEventListener('click', function () { step(1); });

  /* ---------- start screen ---------- */
  function savePrefs() { store.set('prefs', { mode: state.mode, levels: state.levels, last: state.text ? state.text.id : null }); }
  function buildStart() {
    var prefs = store.get('prefs') || {};
    var modes = availableModes();
    if (prefs.mode && modes.some(function (m) { return m.key === prefs.mode; })) state.mode = prefs.mode; else state.mode = modes[0].key;
    if (Array.isArray(prefs.levels)) {
      var lv = prefs.levels.filter(function (l) { return LEVELS.indexOf(l) !== -1; });
      if (lv.length) state.levels = lv;
    }
    var cm = $('ctl-mode'); cm.innerHTML = '';
    modes.forEach(function (m) {
      var b = btn(m.label, 'lf-btn', function () { state.mode = m.key; savePrefs(); syncStart(); });
      b.setAttribute('role', 'radio'); b.setAttribute('data-mode', m.key); b.title = m.part; cm.appendChild(b);
    });
    var cl = $('ctl-level');
    LEVELS.forEach(function (l) {
      var b = btn(l, 'lf-btn', function () {
        var i = state.levels.indexOf(l);
        if (i === -1) state.levels.push(l); else if (state.levels.length > 1) state.levels.splice(i, 1);
        savePrefs(); syncStart();
      });
      b.setAttribute('data-level', l); cl.appendChild(b);
    });
    syncStart();
    if (prefs.last) state.lastId = prefs.last;
  }
  function syncStart() {
    Array.prototype.forEach.call($('ctl-mode').children, function (b) { b.setAttribute('aria-checked', b.getAttribute('data-mode') === state.mode ? 'true' : 'false'); });
    Array.prototype.forEach.call($('ctl-level').querySelectorAll('[data-level]'), function (b) {
      b.setAttribute('aria-pressed', state.levels.indexOf(b.getAttribute('data-level')) !== -1 ? 'true' : 'false');
    });
    $('start-msg').textContent = D.textsFor(state.mode, state.levels).length ? '' : 'Der er endnu ingen tekst på det valgte niveau.';
  }
  function showStart() {
    state.view = 'start'; state.token++; qHost.innerHTML = ''; fbHost.innerHTML = '';
    $('screen-play').hidden = true; $('screen-start').hidden = false; $('btn-menu').hidden = true;
    syncStart(); $('btn-play').focus({ preventScroll: true });
  }
  function startPlay() {
    try { DC.ui.sound.playCtx(); } catch (err) { /* sound is optional */ }   // build the AudioContext on the Spil gesture
    var texts = D.textsFor(state.mode, state.levels);
    if (!texts.length) { syncStart(); return; }
    var next = texts[0];
    for (var i = 0; i < texts.length; i++) if (texts[i].id === state.lastId && texts[i + 1]) next = texts[i + 1];
    state.text = next; state.lastId = next.id; state.qi = 0; state.answered = {}; state.summary = false;
    savePrefs();
    $('screen-start').hidden = true; $('screen-play').hidden = false; $('btn-menu').hidden = false; state.view = 'play';
    renderText(next); panelCollapse(false); render();
    anchor = store.get('scroll:' + next.id) || { par: 1, offset: 0 };
    reader.scrollTop = 0; applyAnchor(anchor);
    reader.focus({ preventScroll: true });
  }
  $('btn-play').addEventListener('click', startPlay);
  $('btn-menu').addEventListener('click', showStart);
  $('btn-reset').addEventListener('click', function () {
    var ok = false;
    try { ok = window.confirm('Vil du nulstille alle fremskridt i Læseforståelse? Det kan ikke fortrydes.'); } catch (err) { ok = false; }
    if (!ok) return;
    srs.items = {}; srs.patterns = {};
    DC.store.set('srs:' + NS, { items: {}, patterns: {} });
    ['skim', 'mc', 'insert', 'cloze'].forEach(function (m) { D.textsFor(m).forEach(function (t) { store.remove('scroll:' + t.id); }); });
    store.remove('prefs'); state.lastId = null;
    DC.ui.announce('Fremskridt nulstillet.');
  });

  /* ---------- keys: numbers answer (shared quiz), J/K questions, Escape. Arrow keys are never handled. ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (state.view !== 'play') return;
    var k = (e.key || '').toLowerCase();
    if (k === 'j') { e.preventDefault(); step(-1); }
    else if (k === 'k') { e.preventDefault(); step(1); }
    else if (k === 'escape') {
      var open = textEl.querySelector('details[open]');
      if (open) open.removeAttribute('open'); else clearHighlight();
    }
  });

  applyReading();
  buildStart();
})();
</script>
</body>
</html>
