<!DOCTYPE html>
<!-- Source for shared/icons/og-image.png (1200x630). Rebuild: node shared/icons/build-og.mjs -->
<html lang="da">
<head>
<meta charset="UTF-8" />
<title>og card</title>
<link rel="stylesheet" href="../sjovt.css" />
<script src="../sjovt.js"></script>
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; }
  .card { position: absolute; inset: 40px; background: var(--sd-orange); box-shadow: var(--sd-box), 16px 16px 0 0 #101010;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; padding: 0 64px; color: #101010; }
  h1 { margin: 0 0 24px; font-family: var(--sd-font-logo); font-weight: 400; font-size: 92px; line-height: 1.15; text-shadow: 6px 6px 0 var(--sd-cream); }
  h1 span { display: block; }
  .tag { margin: 0 0 28px; font-family: var(--sd-font-display); font-weight: 700; font-size: 34px; line-height: 1.3; }
  .tag i { font-style: normal; display: block; font-size: 26px; font-weight: 400; }
  .chips span { display: inline-block; margin: 0 10px 0 0; padding: 8px 14px; background: #101010; color: var(--sd-cream);
    font-family: var(--sd-font-display); font-weight: 700; font-size: 24px; }
  .mascot { width: 336px; height: 336px; display: grid; place-items: center; background: var(--sd-mustard); box-shadow: var(--sd-box); }
</style>
</head>
<body data-sd-home>
  <div class="card">
    <div>
      <h1><span>SJOVT</span><span>DANSK</span></h1>
      <p class="tag">Lær dansk ved at spille<i>Learn Danish with free games</i></p>
      <p class="chips"><span>GRATIS</span><span>A1–B2</span><span>14 SPIL</span></p>
    </div>
    <div class="mascot"><span data-sd-sprite="polle" data-scale="18"></span></div>
  </div>
</body>
</html>
