schema_version: "1.1"
name: pipeline-seams-and-shared-gate
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A written, severity-ranked audit of the five agent prompts that finds the cross-prompt seams:
  check-data.js only validates data/shared although builder and checker treat it as the repo-wide gate;
  builder is told to run npm test / node but has no Bash tool; checker's FLAKY and report path
  (reports/<feature-name>.md) don't match shipper's gate (PASS only, reports/<task-id>.md);
  builder's end-of-task memory writes dirty the worktree that shipper requires clean (shipper memory
  confirms); docs-writer pushes to main despite "shipper is the only agent that pushes" and relies on a
  missing style-guide skill; orchestrator doesn't know docs-writer. Findings cite files and evidence.
