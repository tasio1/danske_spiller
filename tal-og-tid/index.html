<style>
  /* ---- Tal og tid — structural styles. Colour tokens fall back to a neutral palette and are
     remapped to the shared Sjovt tokens (--sd-*) once sjovt.css has set html.sd-page. ---- */
  :root{
    --bg:#FFF4D6; --panel:#FFFBEA; --panel-2:#F3E3B3; --text:#101010; --muted:#3A3326;
    --line:#101010; --accent:#F94F37; --accent-fg:#101010; --correct:#1F7A3A; --wrong:#B0295A;
    --dc-fg:var(--text); --dc-btn-bg:var(--panel); --dc-border:var(--line); --dc-accent:var(--accent); --dc-accent-fg:var(--accent-fg);
    --dc-input-bg:#fff; --dc-correct:var(--correct); --dc-correct-bg:#CFF1C9;
    --dc-wrong:var(--wrong); --dc-wrong-bg:#FFD0DE;
  }
  html.sd-page{
    --bg:var(--sd-bg); --panel:var(--sd-panel); --panel-2:var(--sd-panel-2); --text:var(--sd-text); --muted:var(--sd-text-soft);
    --line:var(--sd-line); --accent:var(--sd-orange); --accent-fg:#101010; --correct:var(--sd-ok); --wrong:var(--sd-bad);
    --dc-correct:var(--sd-ok); --dc-correct-bg:var(--sd-ok-bg); --dc-wrong:var(--sd-bad); --dc-wrong-bg:var(--sd-bad-bg);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;padding:18px 12px 48px;line-height:1.5}
  html.sd-page body{display:block;min-height:calc(100dvh - var(--sd-bar-h));padding:0;font-family:var(--sd-font-body);line-height:1.6}
  .shell{width:100%;max-width:640px;margin:0 auto}
  html.sd-page .shell{max-width:720px;padding:var(--sd-5) var(--sd-3) var(--sd-8);position:relative;z-index:1}
  header.topbar{display:flex;align-items:center;gap:.6em;margin-bottom:16px}
  .brand{font-weight:700;font-size:1.3rem;flex:1 1 auto;display:flex;align-items:center;gap:.4em;min-width:0;overflow-wrap:anywhere;text-transform:uppercase}
  .icon-btn{min-width:48px;min-height:48px;padding:4px 12px;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:700;font-size:.9rem;letter-spacing:.04em;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:0;cursor:pointer}
  html.sd-page .icon-btn{margin:var(--sd-bw);border:0;box-shadow:var(--sd-box),0 8px 0 -4px var(--sd-ink)}
  .card{background:var(--panel);border:2px solid var(--line);padding:24px 16px 20px;overflow-wrap:anywhere}
  html.sd-page .card{border:0;margin:var(--sd-bw);box-shadow:var(--sd-box),var(--sd-drop)}
  h1.title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:.1em 0 .3em;font-size:clamp(26px,7vw,38px);line-height:1.15;text-transform:uppercase;overflow-wrap:anywhere}
  .lede{margin:.2em 0 1em;color:var(--muted)}
  .group-label{font-size:1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:1.2em 0 .6em;border-bottom:4px solid var(--line);padding-bottom:4px}
  .chips,.modes{display:flex;flex-wrap:wrap;gap:10px}
  .chip,.mode-btn{min-height:48px;min-width:48px;padding:6px 14px;font:inherit;font-weight:700;background:var(--panel-2);color:var(--text);border:2px solid var(--line);border-radius:0;cursor:pointer;text-align:left;overflow-wrap:anywhere}
  html.sd-page .chip,html.sd-page .mode-btn{margin:var(--sd-bw);border:0;box-shadow:var(--sd-box)}
  .mode-btn{display:inline-flex;align-items:center;gap:.6em}
  .mode-btn .num{width:32px;height:32px;flex:0 0 auto;background:var(--accent-fg);color:#FFE9B0;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
  .chip::before{content:"○";margin-right:8px}
  .chip[aria-pressed="true"]::before{content:"✓"}
  .chip[aria-pressed="true"],.mode-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
  html.sd-page .chip[aria-pressed="true"],html.sd-page .mode-btn[aria-pressed="true"]{box-shadow:var(--sd-box),var(--sd-bevel)}
  .mode-btn[aria-pressed="true"] > span:last-child::after{content:" ✓"}
  .chip:hover,.mode-btn:hover,.btn:hover:not(:disabled),.icon-btn:hover{background:var(--sd-cream,#EBD08F);color:#101010}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--sd-focus,#2B3FD6);outline-offset:3px}
  html[data-theme="dark"] button:focus-visible,html[data-theme="dark"] a:focus-visible,html[data-theme="dark"] input:focus-visible{outline-color:var(--sd-focus,#FFC25A)}
  .primary{display:flex;align-items:center;justify-content:center;margin-top:1em;width:100%;min-height:64px;font:inherit;font-size:clamp(20px,5vw,26px);font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:2px solid var(--line);border-radius:0;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
  html.sd-page .primary{width:calc(100% - 8px);margin:var(--sd-3) var(--sd-bw) var(--sd-2);border:0;box-shadow:var(--sd-box),var(--sd-bevel),0 12px 0 -4px var(--sd-ink)}
  .primary:hover{background:var(--sd-cream,#EBD08F)}
  .btn{min-height:48px;min-width:48px;padding:8px 18px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:2px solid var(--line);border-radius:0;cursor:pointer;background:var(--panel-2);color:var(--text)}
  html.sd-page .btn{margin:var(--sd-bw);border:0;box-shadow:var(--sd-box),0 8px 0 -4px var(--sd-ink)}
  .btn.accent{background:var(--accent);color:var(--accent-fg)}
  .btn:disabled{cursor:default;opacity:.6}

  .playbar{display:flex;align-items:center;gap:.6em;margin-bottom:14px}
  .progress{flex:1 1 auto;height:20px;background:var(--panel-2);overflow:hidden;border:2px solid var(--line)}
  .progress > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s steps(6)}
  .count{font-weight:700;min-width:4em;text-align:right}

  .case-tag{display:inline-block;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;padding:2px 10px;background:var(--accent-fg);color:#FFE9B0}
  html[data-theme="dark"] .case-tag{background:#101010;color:#FFE9B0;box-shadow:0 0 0 2px var(--line)}
  .prompt{margin:.2em 0 .6em;font-size:1.15rem;font-weight:700}
  .clock-wrap{display:flex;justify-content:center;margin:.4em 0 .8em}
  svg.clock{width:min(100%,260px);height:auto;display:block}
  svg.clock.small{width:100%;max-width:130px}
  .c-face{fill:#FFFBEA;stroke:#101010;stroke-width:5}
  .c-tick{stroke:#101010;stroke-width:1.5}
  .c-tick5{stroke:#101010;stroke-width:4}
  .c-num{fill:#101010;font-family:var(--sd-font-body,system-ui,sans-serif);font-weight:700;font-size:20px;text-anchor:middle;dominant-baseline:central}
  .c-hour{stroke:#101010;stroke-width:10;stroke-linecap:round}
  .c-min{stroke:#101010;stroke-width:5;stroke-linecap:round}
  .c-dot{fill:#101010}
  .target{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;margin:.5em 0;padding:12px 14px;background:var(--sd-cream,#FFFBEA);color:#101010;border:2px solid var(--line);font-weight:700;font-size:clamp(20px,5.4vw,26px);line-height:1.5}
  html.sd-page .target{border:0;box-shadow:var(--sd-box);margin:var(--sd-3) var(--sd-bw)}
  .target .sentence{flex:1 1 12em;min-width:0}
  .bigshow{flex:1 1 8em;min-width:0;overflow-wrap:anywhere}
  .bigshow.digital{font-size:clamp(34px,11vw,52px);letter-spacing:.08em;text-align:center}
  .hint{display:inline-block;padding:0 10px;background:#101010;color:#FFE9B0;font-size:.85em}
  .sd-gap{display:inline-block;min-width:2.2em;text-align:center;border-bottom:4px solid #17233F;background:#FFFBEA;color:#101010;padding:0 .3em}
  .sd-gap.is-ok{background:#CFF1C9;color:#0E3A19;border-bottom-color:#1F7A3A}
  .sd-gap.is-bad{background:#FFD0DE;color:#6B0F2B;border-bottom-color:#B0295A}
  .sd-gap.is-ok::before{content:"✓ "}
  .sd-gap.is-bad::before{content:"✗ "}

  .options{display:flex;flex-direction:column;gap:10px;margin-top:.8em}
  .options.clocks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{display:flex;align-items:center;gap:.7em;text-align:left;min-height:56px;padding:8px 14px;font:inherit;font-weight:700;font-size:clamp(17px,4.8vw,20px);border:2px solid var(--line);border-radius:0;background:var(--panel-2);color:var(--text);cursor:pointer;overflow-wrap:anywhere;width:100%}
  html.sd-page .opt{margin:var(--sd-bw);width:calc(100% - 8px);border:0;box-shadow:var(--sd-box),0 8px 0 -4px var(--sd-ink)}
  .opt .onum{width:32px;height:32px;flex:0 0 auto;background:var(--accent-fg);color:#FFE9B0;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
  .opt.clockopt{flex-direction:column;justify-content:center;padding:10px;gap:6px}
  .opt:hover:not(:disabled):not([aria-disabled="true"]){background:var(--sd-cream,#EBD08F);color:#101010}
  .opt[aria-disabled="true"]{cursor:default}
  .opt.chosen-correct,.opt.reveal-correct{background:var(--dc-correct-bg);color:var(--text);outline:4px solid var(--correct);outline-offset:-4px}
  .opt.chosen-wrong{background:var(--dc-wrong-bg);color:var(--text);outline:4px solid var(--wrong);outline-offset:-4px}
  html[data-theme="dark"] .opt.chosen-correct,html[data-theme="dark"] .opt.reveal-correct{color:var(--text)}
  .opt.chosen-correct .otxt::after,.opt.reveal-correct .otxt::after{content:"  ✓";font-weight:700}
  .opt.chosen-wrong .otxt::after{content:"  ✗";font-weight:700}
  .opt.clockopt.chosen-correct::after,.opt.clockopt.reveal-correct::after{content:"✓ rigtigt";font-weight:700}
  .opt.clockopt.chosen-wrong::after{content:"✗ forkert";font-weight:700}

  .answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-top:.8em}
  .answer-row input{flex:1 1 10em;min-width:0;min-height:56px;padding:6px 14px;font:inherit;font-size:1.4rem;font-weight:700;background:#fff;color:#101010;border:3px solid var(--line);border-radius:0}
  .answer-row input.ok{background:#CFF1C9;border-color:var(--correct)}
  .answer-row input.bad{background:#FFD0DE;border-color:var(--wrong)}
  .answer-row .btn{flex:0 0 auto}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  .slip{margin-top:1.2em;padding:14px;background:var(--dc-wrong-bg);color:var(--text);border-left:8px solid var(--wrong)}
  html[data-theme="dark"] .slip{color:var(--text)}
  .slip .sol{display:inline-block;background:var(--sd-cream,#FFFBEA);color:#101010;font-weight:700;font-size:1.15em;padding:0 8px}
  .slip .yours{margin-top:.3em;font-size:.95rem}
  .slip .note{margin-top:.6em;padding:10px 12px;background:var(--panel);color:var(--text);border:2px solid var(--line)}
  .slip .actions{margin-top:.8em;display:flex;gap:.6em;flex-wrap:wrap;align-items:center}

  .sum-head{font-size:clamp(22px,6vw,32px);margin:.1em 0 .6em;text-transform:uppercase;text-align:center}
  .sum-stats{display:flex;gap:1.2em;flex-wrap:wrap;justify-content:center;margin-bottom:1em}
  .sum-stats .stat{background:var(--sd-cream,#FFFBEA);color:#101010;padding:10px 22px;text-align:center;min-width:130px;border:2px solid var(--line)}
  .sum-stats .stat b{display:block;font-size:2rem}
  .sum-stats .stat span{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .weak-list{list-style:none;padding:0;margin:.2em 0 1em;display:flex;flex-direction:column;gap:.5em}
  .weak-list li{background:var(--panel-2);border:2px solid var(--line);padding:.5em .7em;overflow-wrap:anywhere}
  .xgame{display:inline-flex;align-items:center;min-height:48px;margin-top:.4em;text-decoration:none;background:var(--accent-fg);color:#FFE9B0;font-weight:700;padding:.55em .9em}
  .sum-actions{display:flex;gap:.6em;flex-wrap:wrap;margin-top:1em;justify-content:center}
  .sum-actions .primary{width:auto;margin:var(--sd-bw,0);padding:0 1.4em}
  .empty-state{text-align:center;padding:1.5em .5em}
  .hidden{display:none !important}
  @keyframes press-in{0%{transform:scale(1)}45%{transform:scale(.98)}100%{transform:scale(1)}}
  .press{animation:press-in .28s ease}
  @media (max-width:480px){
    .brand{font-size:1.05rem}
    html.sd-page .shell{padding-left:var(--sd-2);padding-right:var(--sd-2)}
    .card{padding:20px 10px 16px}
  }
  @media (prefers-reduced-motion: reduce){
    .press{animation:none}
    .progress > i{transition:none}
  }
</style>

<script>
(function(){
  'use strict';

  var DC = window.DanskCore;
  var DATA = window.TALOGTID_DATA || {};
  var GAME_ID = 'tal-og-tid';
  var ROUND_SIZE = 10;
  var LEVELS = ['A1','A2','B1'];

  var MODES = [
    { key:'klokken', num:1, name:'Klokken', groups:[
      { key:'aflaes',  label:'Aflæs uret' },
      { key:'find',    label:'Find uret' },
      { key:'digital', label:'Digitalt ur' } ] },
    { key:'tal', num:2, name:'Tal', groups:[
      { key:'op-til-20', label:'0–20' },
      { key:'21-49',     label:'21–49' },
      { key:'boss',      label:'Bosskamp 50–99' },
      { key:'hundreder', label:'Hundreder' } ] },
    { key:'aarstal', num:3, name:'Årstal og ordenstal', groups:[
      { key:'aarstal',   label:'Årstal' },
      { key:'ordenstal', label:'Ordenstal' },
      { key:'datoer',    label:'Datoer' },
      { key:'priser',    label:'Priser' } ] }
  ];
  var MODE_BY_KEY = {};
  MODES.forEach(function(m){ MODE_BY_KEY[m.key] = m; });

  // one cross-game chip per mode at most
  var CROSS = {
    tal: { href:'../en-og-et/index.html', text:'Usikker på en og et? → En/Et-træner' }
  };

  // ---- sound theme ----
  var SOUND = {
    correct:function(){ DC.ui.sound.sequence([
      {type:'sine',frequency:180,duration:0.08,gain:0.05},
      {type:'sine',frequency:440,duration:0.08,gain:0.06,delay:0.10},
      {type:'sine',frequency:660,duration:0.10,gain:0.05,delay:0.18}
    ]); },
    wrong:function(){ DC.ui.sound.sequence([
      {type:'noise',frequency:0,duration:0.08,gain:0.035},
      {type:'sine',frequency:220,duration:0.10,gain:0.03,delay:0.08}
    ]); },
    roundComplete:function(){ DC.ui.sound.sequence([
      {type:'triangle',frequency:180,duration:0.10,gain:0.07},
      {type:'triangle',frequency:180,duration:0.10,gain:0.07,delay:0.22},
      {type:'triangle',frequency:180,duration:0.10,gain:0.07,delay:0.44},
      {type:'sine',frequency:330,duration:0.40,gain:0.07,delay:0.60}
    ]); }
  };

  var prefs = DC.store.namespace(GAME_ID);
  var srsState = DC.srs.load(GAME_ID);

  var state = {
    mode: 'klokken',
    groups: { klokken:'alle', tal:'alle', aarstal:'alle' },
    levels: LEVELS.slice(),
    round: [], idx: 0, correct: 0, missed: []
  };

  var el = {
    start: document.getElementById('start-screen'),
    play: document.getElementById('play-screen'),
    summary: document.getElementById('summary-screen'),
    modeList: document.getElementById('mode-list'),
    groupList: document.getElementById('group-list'),
    levelList: document.getElementById('level-list'),
    itemHost: document.getElementById('item-host'),
    sumHost: document.getElementById('summary-host'),
    fill: document.getElementById('progress-fill'),
    pcount: document.getElementById('progress-count')
  };

  DC.ui.darkMode.init();
  DC.ui.sound.init(true);   // mute lives in the shared bar

  var savedMode = prefs.get('mode');
  if (savedMode && MODE_BY_KEY[savedMode]) state.mode = savedMode;
  var savedLevels = prefs.get('levels');
  if (Array.isArray(savedLevels)) {
    var okLv = savedLevels.filter(function(l){ return LEVELS.indexOf(l) !== -1; });
    if (okLv.length) state.levels = okLv;
  }
  MODES.forEach(function(m){
    var g = prefs.get('group:' + m.key);
    if (g && m.groups.some(function(x){ return x.key === g; })) state.groups[m.key] = g;
  });

  // reset progress: confirm, then clear only this game's SRS record (keeps mode/level/sound prefs)
  document.getElementById('btn-reset').addEventListener('click', function(){
    var ok = true;
    try { ok = window.confirm('Vil du nulstille alle fremskridt? Det kan ikke fortrydes.'); } catch (e) { ok = false; }
    if (!ok) return;
    srsState.items = {};
    srsState.patterns = {};
    DC.store.remove('srs:' + GAME_ID);
    DC.ui.announce('Fremskridt nulstillet.');
  });
  document.getElementById('btn-play').addEventListener('click', startRound);
  document.getElementById('btn-back').addEventListener('click', showStart);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !el.play.classList.contains('hidden')) showStart();
  });

  // ---- helpers ----
  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch];
    });
  }
  function srsKey(item){ return GAME_ID + ':' + item.mode + ':' + item.id; }
  function patternKey(item){ return 'pattern:' + GAME_ID + ':' + item.mode + ':' + (item.pattern || item.kind); }
  function filled(item, word){ return String(item.sentence_da).replace(/_{2,}/, word); }
  function poolFor(modeKey, group, levels){
    var all = Array.isArray(DATA[modeKey]) ? DATA[modeKey] : [];
    if (group && group !== 'alle') all = all.filter(function(it){ return it.group === group; });
    return DC.level.filter(all, levels);
  }
  function cap(s){ s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }
  function timeLabel(t){ var p = String(t).split(':'); return (+p[0]) + ':' + p[1]; }

  // Normalise a typed number/price: "199 kr.", "199,-", "1.985", "7,5" -> comparable strings.
  function canonNum(s){
    s = String(s).toLowerCase().replace(/,-/g, '').replace(/kroner|krone|kr\.?/g, '').replace(/\s+/g, '');
    s = s.replace(/(\d)\.(?=\d{3}(\D|$))/g, '$1');
    if (/,\d$/.test(s)) s += '0';
    s = s.replace(/,00$/, '');
    return s;
  }
  function checkTyped(item, raw){
    var ans = String(raw).trim();
    if (!ans) return false;
    if (item.numeric){
      var c = canonNum(ans);
      return item.accepted_answers.some(function(a){ return canonNum(a) === c; });
    }
    return DC.diff.check(ans, item.accepted_answers).correct;
  }

  // ---- analog clock (SVG) ----
  function clockSVG(time, small, label){
    var p = String(time).split(':'), h = (+p[0]) % 12, m = +p[1];
    var ha = (h + m / 60) * 30, ma = m * 6;
    var s = '<svg class="clock' + (small ? ' small' : '') + '" viewBox="0 0 200 200" role="img" aria-label="' + esc(label) + '" focusable="false">';
    s += '<circle class="c-face" cx="100" cy="100" r="94"/>';
    for (var i = 0; i < 60; i++){
      var a = i * 6 * Math.PI / 180, big = i % 5 === 0;
      var r1 = big ? 80 : 86, r2 = 91;
      if (small && !big) continue;
      s += '<line class="' + (big ? 'c-tick5' : 'c-tick') + '" x1="' + (100 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (100 - r1 * Math.cos(a)).toFixed(1) +
           '" x2="' + (100 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (100 - r2 * Math.cos(a)).toFixed(1) + '"/>';
    }
    if (!small){
      for (var n = 1; n <= 12; n++){
        var b = n * 30 * Math.PI / 180;
        s += '<text class="c-num" x="' + (100 + 62 * Math.sin(b)).toFixed(1) + '" y="' + (100 - 62 * Math.cos(b)).toFixed(1) + '">' + n + '</text>';
      }
    }
    s += '<line class="c-hour" x1="100" y1="100" x2="100" y2="' + (small ? 56 : 54) + '" transform="rotate(' + ha.toFixed(1) + ' 100 100)"/>';
    s += '<line class="c-min" x1="100" y1="100" x2="100" y2="22" transform="rotate(' + ma.toFixed(1) + ' 100 100)"/>';
    s += '<circle class="c-dot" cx="100" cy="100" r="7"/></svg>';
    return s;
  }

  // ---- start controls ----
  function buildGroupChips(){
    var m = MODE_BY_KEY[state.mode];
    el.groupList.innerHTML = '';
    [{ key:'alle', label:'Alle' }].concat(m.groups).forEach(function(g){
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip';
      c.textContent = g.label;
      c.setAttribute('aria-pressed', String(state.groups[m.key] === g.key));
      c.addEventListener('click', function(){
        state.groups[m.key] = g.key;
        prefs.set('group:' + m.key, g.key);
        var cs = el.groupList.querySelectorAll('.chip');
        for (var i = 0; i < cs.length; i++) cs[i].setAttribute('aria-pressed', String(cs[i] === c));
      });
      el.groupList.appendChild(c);
    });
  }

  function buildStartControls(){
    el.modeList.innerHTML = '';
    MODES.forEach(function(m){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mode-btn';
      btn.setAttribute('aria-pressed', String(m.key === state.mode));
      btn.innerHTML = '<span class="num" aria-hidden="true">' + m.num + '</span><span>' + esc(m.name) + '</span>';
      btn.addEventListener('click', function(){
        state.mode = m.key;
        prefs.set('mode', m.key);
        var bs = el.modeList.querySelectorAll('.mode-btn');
        for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', String(MODES[i].key === state.mode));
        buildGroupChips();
      });
      el.modeList.appendChild(btn);
    });
    buildGroupChips();
    el.levelList.innerHTML = '';
    LEVELS.forEach(function(lvl){
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip';
      c.textContent = lvl;
      c.setAttribute('aria-pressed', String(state.levels.indexOf(lvl) !== -1));
      c.addEventListener('click', function(){
        var i = state.levels.indexOf(lvl);
        if (i === -1) state.levels.push(lvl);
        else if (state.levels.length > 1) state.levels.splice(i, 1);
        c.setAttribute('aria-pressed', String(state.levels.indexOf(lvl) !== -1));
        prefs.set('levels', state.levels.slice());
      });
      el.levelList.appendChild(c);
    });
  }

  function show(which){
    el.start.classList.toggle('hidden', which !== 'start');
    el.play.classList.toggle('hidden', which !== 'play');
    el.summary.classList.toggle('hidden', which !== 'summary');
    document.getElementById('btn-reset').classList.toggle('hidden', which !== 'start');
  }

  var advanceTimer = null;
  var activeKeyHandler = null;
  function clearPending(){
    if (advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
    if (activeKeyHandler){ document.removeEventListener('keydown', activeKeyHandler); activeKeyHandler = null; }
  }

  function showStart(){
    clearPending();
    buildStartControls();
    show('start');
    window.scrollTo(0, 0);
    document.getElementById('btn-play').focus({ preventScroll: true });
  }

  // ---- round lifecycle ----
  // Queue order: just-missed (box 1, newest first), then due, then unseen, then not-yet-due.
  function buildRound(pool){
    var boxed = [], unseen = [], dueRest = [], notDue = [];
    shuffle(pool.slice()).forEach(function(it){
      var e = srsState.items[srsKey(it)];
      if (!e) unseen.push(it);
      else if (e.box === 1) boxed.push(it);
      else if (DC.srs.isDue(srsState, srsKey(it))) dueRest.push(it);
      else notDue.push(it);
    });
    boxed.sort(function(a, b){ return (srsState.items[srsKey(b)].lastSeen || 0) - (srsState.items[srsKey(a)].lastSeen || 0); });
    notDue.sort(function(a, b){ return srsState.items[srsKey(a)].dueAt - srsState.items[srsKey(b)].dueAt; });
    return shuffle(boxed.concat(dueRest, unseen, notDue).slice(0, ROUND_SIZE));
  }

  function startRound(){
    clearPending();
    var pool = poolFor(state.mode, state.groups[state.mode], state.levels);
    show('play');
    if (!pool.length){ renderEmpty(); return; }
    state.round = buildRound(pool);
    state.idx = 0; state.correct = 0; state.missed = [];
    renderItem();
  }

  function renderEmpty(){
    el.fill.style.width = '0%';
    el.pcount.textContent = '';
    el.itemHost.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'empty-state';
    box.innerHTML = '<p>Der er ingen opgaver til dette valg. Vælg et andet emne eller niveau.</p>';
    var back = document.createElement('button');
    back.className = 'btn accent'; back.type = 'button'; back.textContent = '← TILBAGE';
    back.addEventListener('click', showStart);
    box.appendChild(back);
    el.itemHost.appendChild(box);
    back.focus();
  }

  function renderItem(){
    clearPending();
    if (state.idx >= state.round.length){ finishRound(); return; }
    var pct = Math.round((state.idx / state.round.length) * 100);
    el.fill.style.width = pct + '%';
    el.pcount.textContent = (state.idx + 1) + '/' + state.round.length;
    var item = state.round[state.idx];
    if (item.input) renderTyped(item);
    else renderMC(item);
  }

  function advance(){
    if (advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
    state.idx++;
    renderItem();
  }

  function finishRound(){
    el.fill.style.width = '100%';
    SOUND.roundComplete();
    renderSummary();
    show('summary');
    var again = el.sumHost.querySelector('.primary');
    if (again) again.focus({ preventScroll: true });
  }

  function recordAnswer(item, correct){
    DC.srs.record(srsState, srsKey(item), correct);
    DC.srs.pattern(srsState, patternKey(item), correct);
    if (correct) state.correct++; else state.missed.push(item);
  }

  // ---- item head: tag, prompt, analog clock, display text / sentence, TTS ----
  function buildHead(item){
    var m = MODE_BY_KEY[item.mode];
    var wrap = document.createElement('div');
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', 'Opgave');

    var tag = document.createElement('p');
    tag.className = 'case-tag';
    tag.textContent = 'Opgave ' + (state.idx + 1) + (m ? ' · ' + m.name : '');
    wrap.appendChild(tag);

    if (item.prompt_da){
      var pr = document.createElement('p');
      pr.className = 'prompt';
      pr.textContent = item.prompt_da;
      wrap.appendChild(pr);
    }
    if (item.clock){
      var cw = document.createElement('div');
      cw.className = 'clock-wrap';
      cw.innerHTML = clockSVG(item.clock, false, 'Analogt ur. Opgaven er visuel; vælg Digitalt ur for en tekstversion.');
      wrap.appendChild(cw);
    }

    var target = document.createElement('div');
    target.className = 'target';
    var blank = null;
    if (item.show){
      var s = document.createElement('span');
      s.className = item.sentence_da ? 'hint' : 'bigshow' + (item.kind === 'digital_to_phrase' ? ' digital' : '');
      s.textContent = item.show;
      target.appendChild(s);
    }
    if (item.sentence_da){
      var sent = document.createElement('div');
      sent.className = 'sentence';
      String(item.sentence_da).split(/_{2,}/).forEach(function(seg, i, arr){
        sent.appendChild(document.createTextNode(seg));
        if (i < arr.length - 1){
          blank = document.createElement('span');
          blank.className = 'sd-gap';
          blank.textContent = '?';
          blank.setAttribute('role', 'img');
          blank.setAttribute('aria-label', 'tomt felt');
          sent.appendChild(blank);
        }
      });
      target.appendChild(sent);
    }
    var speak = item.tts_prompt || (item.sentence_da ? String(item.sentence_da).replace(/_{2,}/, ' … ') : '');
    if (speak) DC.ui.ttsButton(speak, target, 'Lyt til opgaven');
    if (target.childNodes.length) wrap.appendChild(target);
    return { wrap: wrap, blank: blank };
  }

  function fillBlank(blank, item, correct){
    if (!blank) return;
    blank.textContent = item.correct;
    blank.removeAttribute('aria-label');
    blank.removeAttribute('role');
    blank.classList.add('is-filled', correct ? 'is-ok' : 'is-bad');
  }

  function spokenAnswer(item){
    if (item.tts) return item.tts;
    return item.sentence_da ? filled(item, item.correct) : item.correct;
  }

  // ---- multiple choice (text or clock options) ----
  function renderMC(item){
    var head = buildHead(item);
    var wrap = head.wrap;
    var isClock = item.option_type === 'clock';

    var opts = document.createElement('div');
    opts.className = 'options' + (isClock ? ' clocks' : '');
    opts.setAttribute('role', 'group');
    opts.setAttribute('aria-label', 'Svarmuligheder');
    wrap.appendChild(opts);
    var slip = document.createElement('div');
    wrap.appendChild(slip);

    el.itemHost.innerHTML = '';
    el.itemHost.appendChild(wrap);

    var buttons = [];
    var answered = false;
    shuffle((item.options || []).slice()).forEach(function(val, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (isClock ? ' clockopt' : '');
      b.setAttribute('data-value', val);
      if (isClock){
        b.setAttribute('aria-label', 'Svar ' + (i + 1) + ': ur ' + timeLabel(val));
        b.innerHTML = clockSVG(val, true, 'Ur ' + timeLabel(val)).replace('role="img"', 'aria-hidden="true"').replace(/ aria-label="[^"]*"/, '') +
          '<span class="onum" aria-hidden="true">' + (i + 1) + '</span>';
        // keep a text node for the ✓/✗ marker via ::after (clockopt)
      } else {
        b.innerHTML = '<span class="onum" aria-hidden="true">' + (i + 1) + '</span><span class="otxt">' + esc(val) + '</span>';
      }
      b.addEventListener('click', function(){ choose(b); });
      buttons.push(b);
      opts.appendChild(b);
    });

    function choose(btn){
      if (answered) return;
      answered = true;
      if (activeKeyHandler){ document.removeEventListener('keydown', activeKeyHandler); activeKeyHandler = null; }
      var correct = btn.getAttribute('data-value') === item.correct;
      buttons.forEach(function(b){
        b.setAttribute('aria-disabled', 'true');
        var isRight = b.getAttribute('data-value') === item.correct;
        if (b === btn) b.classList.add(correct ? 'chosen-correct' : 'chosen-wrong');
        else if (!correct && isRight) b.classList.add('reveal-correct');
      });
      fillBlank(head.blank, item, correct);
      recordAnswer(item, correct);
      btn.focus({ preventScroll: true });
      sdFx(correct, btn);
      if (correct){
        SOUND.correct();
        if (!DC.ui.motion.isReduced()) wrap.classList.add('press');
        DC.ui.announce('Rigtigt.');
        advanceTimer = setTimeout(advance, 800);
      } else {
        var shown = isClock ? timeLabel(item.correct) : item.correct;
        SOUND.wrong();
        DC.ui.announce('Forkert. Rigtigt svar: ' + shown + '. ' + (item.note || ''));
        buildSlip(slip, item, { shown: shown });
      }
    }

    activeKeyHandler = function(e){
      if (answered) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= buttons.length){ e.preventDefault(); choose(buttons[n - 1]); }
    };
    document.addEventListener('keydown', activeKeyHandler);
    if (buttons[0]) buttons[0].focus();
  }

  // ---- typed answer (digits or written word) ----
  function renderTyped(item){
    var head = buildHead(item);
    var wrap = head.wrap;

    var form = document.createElement('form');
    form.className = 'answer-row';
    form.setAttribute('novalidate', '');
    var lab = document.createElement('label');
    lab.className = 'sr-only';
    lab.setAttribute('for', 'answer-input');
    lab.textContent = 'Dit svar';
    var input = document.createElement('input');
    input.id = 'answer-input';
    input.type = 'text';
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('autocorrect', 'off');
    input.setAttribute('spellcheck', 'false');
    if (item.numeric) input.setAttribute('inputmode', 'text');
    var go = document.createElement('button');
    go.type = 'submit';
    go.className = 'btn accent';
    go.textContent = 'Svar';
    form.appendChild(lab); form.appendChild(input); form.appendChild(go);
    wrap.appendChild(form);
    var slip = document.createElement('div');
    wrap.appendChild(slip);

    el.itemHost.innerHTML = '';
    el.itemHost.appendChild(wrap);

    var answered = false;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if (answered) return;
      var raw = input.value;
      if (!String(raw).trim()){ DC.ui.announce('Skriv et svar.'); input.focus(); return; }
      answered = true;
      var correct = checkTyped(item, raw);
      input.disabled = true; go.disabled = true;
      input.classList.add(correct ? 'ok' : 'bad');
      recordAnswer(item, correct);
      sdFx(correct, input);
      if (correct){
        SOUND.correct();
        if (!DC.ui.motion.isReduced()) wrap.classList.add('press');
        DC.ui.announce('Rigtigt.');
        advanceTimer = setTimeout(advance, 800);
      } else {
        SOUND.wrong();
        DC.ui.announce('Forkert. Rigtigt svar: ' + item.correct + '. ' + (item.note || ''));
        buildSlip(slip, item, { shown: item.correct, yours: String(raw).trim() });
      }
    });
    input.focus();
  }

  // wrong-answer feedback: correct answer + one note + replay + Videre
  function buildSlip(host, item, info){
    host.innerHTML = '';
    var slip = document.createElement('div');
    slip.className = 'slip wrong';
    var sol = document.createElement('div');
    sol.innerHTML = 'Rigtigt svar: <span class="sol">' + esc(info.shown) + '</span>';
    slip.appendChild(sol);
    if (info.yours){
      var y = document.createElement('div');
      y.className = 'yours';
      y.textContent = 'Du skrev: ' + info.yours;
      slip.appendChild(y);
    }
    if (item.note){
      var note = document.createElement('div');
      note.className = 'note';
      note.textContent = item.note;
      slip.appendChild(note);
    }
    var actions = document.createElement('div');
    actions.className = 'actions';
    DC.ui.ttsButton(spokenAnswer(item), actions, 'Lyt til det rigtige svar');
    var next = document.createElement('button');
    next.className = 'btn accent';
    next.type = 'button';
    next.textContent = 'Videre';
    next.addEventListener('click', advance);
    actions.appendChild(next);
    slip.appendChild(actions);
    host.appendChild(slip);
    next.focus();
    sdFx(false, host);
  }

  // ---- summary ----
  function uniqueMissed(){
    var seen = {}, out = [];
    state.missed.forEach(function(it){ if (!seen[it.id]){ seen[it.id] = true; out.push(it); } });
    return out;
  }
  function weakText(item){
    if (item.sentence_da) return filled(item, item.correct) + ' (' + item.show + ')';
    if (item.kind === 'clock_to_phrase') return cap(item.correct) + ' = ' + timeLabel(item.clock);
    if (item.kind === 'phrase_to_clock') return cap(item.show) + ' = ' + timeLabel(item.correct);
    if (item.kind === 'digital_to_phrase') return item.show + ' = ' + item.correct;
    return item.show + ' = ' + item.correct;
  }

  function renderSummary(){
    var total = state.round.length;
    var acc = total ? Math.round((state.correct / total) * 100) : 0;
    el.sumHost.innerHTML = '';

    var h = document.createElement('h2');
    h.className = 'sum-head';
    h.textContent = 'Runden er slut';
    el.sumHost.appendChild(h);

    var stats = document.createElement('div');
    stats.className = 'sum-stats';
    stats.innerHTML = '<div class="stat"><b>' + state.correct + '/' + total + '</b><span>Rigtige</span></div>' +
      '<div class="stat"><b>' + acc + '%</b><span>Præcision</span></div>';
    el.sumHost.appendChild(stats);

    var weak = uniqueMissed().slice(0, 3);
    if (weak.length){
      var wl = document.createElement('div');
      wl.className = 'group-label';
      wl.textContent = 'Øv disse igen';
      el.sumHost.appendChild(wl);
      var ul = document.createElement('ul');
      ul.className = 'weak-list';
      weak.forEach(function(item){
        var li = document.createElement('li');
        li.textContent = weakText(item);
        ul.appendChild(li);
      });
      el.sumHost.appendChild(ul);
    }

    var x = CROSS[state.mode];
    if (x){
      var a = document.createElement('a');
      a.className = 'xgame';
      a.href = x.href;
      a.textContent = x.text;
      el.sumHost.appendChild(a);
    }

    var actions = document.createElement('div');
    actions.className = 'sum-actions';
    var again = document.createElement('button');
    again.className = 'primary';
    again.type = 'button';
    again.textContent = 'Spil igen';
    again.addEventListener('click', startRound);
    actions.appendChild(again);

    if (state.missed.length){
      var retry = document.createElement('button');
      retry.className = 'btn';
      retry.type = 'button';
      retry.textContent = 'Gentag fejl';
      retry.addEventListener('click', function(){
        state.round = shuffle(uniqueMissed());
        state.idx = 0; state.correct = 0; state.missed = [];
        show('play');
        renderItem();
      });
      actions.appendChild(retry);
    }
    var home = document.createElement('button');
    home.className = 'btn';
    home.type = 'button';
    home.textContent = 'Til start';
    home.addEventListener('click', showStart);
    actions.appendChild(home);
    el.sumHost.appendChild(actions);

    var S = window.Sjovt;
    if (S && state.correct > 0 && S.fx && S.fx.celebrate) S.fx.celebrate();
  }

  function sdFx(correct, node){
    var S = window.Sjovt;
    if (!S || !S.fx || !node) return;
    if (correct) S.fx.correct(node); else S.fx.wrong(node);
  }

  buildStartControls();
  if (window.Sjovt && window.Sjovt.watchScreens) window.Sjovt.watchScreens('#start-screen, #play-screen, #summary-screen');
})();
</script>
